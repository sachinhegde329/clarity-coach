<script>
        // Simple script to demonstrate timer ring animation logic
        // In a real app, this would be tied to actual recording state
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.querySelector('button[aria-label="Start Recording"]');
            const ring = document.getElementById('timerRing');
            let isRecording = false;
            let progress = 0;
            let interval;

            micBtn.addEventListener('click', () => {
                isRecording = !isRecording;
                
                if (isRecording) {
                    micBtn.classList.add('bg-error-warning');
                    micBtn.classList.remove('bg-primary');
                    document.querySelector('.pulse-ring').style.display = 'block';
                    
                    // Simulate 60s countdown for visual effect (sped up for demo)
                    progress = 0;
                    interval = setInterval(() => {
                        progress += 1;
                        // Circumference is ~301
                        const offset = 301 - (progress / 100) * 301;
                        ring.style.strokeDashoffset = offset;
                        if (progress >= 100) {
                            clearInterval(interval);
                            resetMic();
                        }
                    }, 600); // 100 steps over 60s
                } else {
                    resetMic();
                }
            });

            function resetMic() {
                isRecording = false;
                clearInterval(interval);
                micBtn.classList.remove('bg-error-warning');
                micBtn.classList.add('bg-primary');
                ring.style.strokeDashoffset = 0;
            }
        });
    </script>
