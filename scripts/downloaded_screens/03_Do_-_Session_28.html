<!-- Track -->
<circle class="stroke-outline-variant" cx="50" cy="50" fill="none" r="46" stroke-width="2"></circle>
<!-- Active Progress (Depleting) -->
<circle class="stroke-primary transition-all duration-100 ease-linear" cx="50" cy="50" fill="none" id="timer-ring" r="46" stroke-dasharray="289.02" stroke-dashoffset="0" stroke-width="4"></circle>
<!-- 10-second Notch Marker (1/6th of 360 = 60 degrees) -->
<line stroke="var(--color-background)" stroke-width="4" transform="rotate(60, 50, 50)" x1="50" x2="50" y1="4" y2="10"></line>

</svg>

<!-- JS for Interaction -->
<script>
        const recordBtn = document.getElementById('record-btn');
        const recordIcon = document.getElementById('record-icon');
        const timerDisplay = document.getElementById('timer-display');
        const timerRing = document.getElementById('timer-ring');
        const statusText = document.getElementById('status-text');
        const commitBtn = document.getElementById('commit-btn');
        const inkDots = document.getElementById('ink-dots');
        
        let isRecording = false;
        let timerInterval;
        let seconds = 0;
        const totalSeconds = 60;
        const ringCircumference = 2 * Math.PI * 46; // r=46
        
        timerRing.style.strokeDasharray = ringCircumference;
        timerRing.style.strokeDashoffset = 0;

        function updateTimerDisplay() {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
            
            // Calculate ring depletion (clockwise depletion)
            const offset = (seconds / totalSeconds) * ringCircumference;
            timerRing.style.strokeDashoffset = offset;
            
            // Constraint logic feedback
            if (seconds > 0 && seconds <= 10) {
                statusText.textContent = "Stating Hypothesis...";
                statusText.classList.add('text-primary');
            } else if (seconds > 10 && seconds < 60) {
                statusText.textContent = "Supporting Argument...";
                statusText.classList.remove('text-primary');
            } else if (seconds >= 60) {
                stopRecording();
                statusText.textContent = "Time Limit Reached";
                commitBtn.classList.remove('pointer-events-none', 'opacity-50');
            }
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);
            recordBtn.classList.remove('mic-pulse', 'bg-error-warning');
            recordBtn.classList.add('bg-primary');
            recordIcon.textContent = 'check';
            inkDots.classList.replace('opacity-100', 'opacity-0');
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording && seconds < totalSeconds) {
                // Start
                isRecording = true;
                recordBtn.classList.add('mic-pulse', 'bg-error-warning');
                recordBtn.classList.remove('bg-primary');
                recordIcon.textContent = 'stop';
                inkDots.classList.replace('opacity-0', 'opacity-100');
                
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimerDisplay();
                }, 1000);
            } else if (isRecording) {
                // Stop manually
                stopRecording();
                statusText.textContent = "Recording Complete";
                commitBtn.classList.remove('pointer-events-none', 'opacity-50');
            }
        });
    </script>
