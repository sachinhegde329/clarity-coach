<!-- Interactive Logic -->
<script>
        const micBtn = document.getElementById('mic-btn');
        const timerRing = document.getElementById('timer-ring');
        const timeDisplay = document.getElementById('time-display');
        const pulseContainer = document.getElementById('pulse-container');
        
        const TOTAL_TIME = 15;
        const CIRCUMFERENCE = 2 * Math.PI * 46; // 289.026
        
        let isRecording = false;
        let timerInterval;
        let pulseInterval;
        let timeLeft = TOTAL_TIME;

        // Initialize Ring
        timerRing.style.strokeDasharray = CIRCUMFERENCE;
        timerRing.style.strokeDashoffset = 0;

        function createInkDot() {
            const dot = document.createElement('div');
            dot.className = 'w-1.5 h-1.5 bg-primary rounded-full absolute ink-dot-anim';
            
            // Random angle and distance for the Brutalist ink-dot pulse
            const angle = Math.random() * Math.PI * 2;
            const distance = 40 + Math.random() * 30;
            const tx = Math.cos(angle) * distance + 'px';
            const ty = Math.sin(angle) * distance + 'px';
            
            dot.style.setProperty('--tx', tx);
            dot.style.setProperty('--ty', ty);
            
            pulseContainer.appendChild(dot);
            
            // Cleanup
            setTimeout(() => {
                if(dot.parentNode) dot.parentNode.removeChild(dot);
            }, 1000);
        }

        function startRecording() {
            isRecording = true;
            timeLeft = TOTAL_TIME;
            micBtn.classList.add('bg-error-warning', 'border-tertiary-container');
            micBtn.classList.remove('bg-primary-container');
            
            // Start ink-dot pulses simulating real-time filler word detection energy
            pulseInterval = setInterval(createInkDot, 150);

            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                
                // Update text display (Data as hero)
                timeDisplay.textContent = Math.ceil(timeLeft).toString().padStart(2, '0');
                
                // Deplete ring clockwise
                const offset = CIRCUMFERENCE - ((timeLeft / TOTAL_TIME) * CIRCUMFERENCE);
                timerRing.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    stopRecording();
                }
            }, 100);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);
            clearInterval(pulseInterval);
            
            micBtn.classList.remove('bg-error-warning', 'border-tertiary-container');
            micBtn.classList.add('bg-primary-container');
            
            // Reset for demo purposes
            setTimeout(() => {
                timeLeft = TOTAL_TIME;
                timeDisplay.textContent = TOTAL_TIME;
                timerRing.style.strokeDashoffset = 0;
            }, 1000);
        }

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
    </script>
