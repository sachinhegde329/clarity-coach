<!-- Main Content -->

<!-- Header Section -->

<div class="flex justify-between items-end mb-xs border-b-2 border-primary pb-base">
<span class="font-label-md text-label-md text-primary uppercase tracking-widest">Step 05/05</span>

</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary leading-none uppercase mt-sm">
                05 Commit - Session 3
            </h1>
</header>
<!-- Prompt Section -->
<section class="flex-1 flex flex-col items-center">
<div class="w-full mb-xl">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">
                    "This week, I commit to..."
                </h2>
<div class="border-l-4 border-primary pl-md py-xs">
<p class="font-body-lg text-body-lg text-secondary">
                        Speak your commitment clearly. Stating your intention aloud creates a psychological anchor for your new habits.
                    </p>
</div>
</div>
<!-- Central Voice Input -->
<div class="w-full flex flex-col items-center justify-center py-xl">
<div class="relative">
<button class="group relative w-40 h-40 bg-primary flex items-center justify-center border-2 border-primary transition-all duration-200" id="mic-button">
<span class="material-symbols-outlined text-surface-bright !text-6xl" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
<!-- Offset Border for Brutalist Look -->
<div class="absolute inset-0 border-2 border-primary -z-10 translate-x-2 translate-y-2 group-active:translate-x-0 group-active:translate-y-0 transition-transform"></div>
</button>
</div>
<p class="font-label-md text-label-md text-primary uppercase tracking-tighter mt-xl" id="mic-status">Tap to speak</p>
</div>
</section>
<!-- Editorial Spacer -->

</main>
<!-- Fixed Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t-2 border-primary p-margin z-40">

            </button>
<!-- Secondary Actions -->
<div class="flex gap-sm">
<button class="flex-1 border-2 border-primary py-sm px-md font-label-md text-label-md uppercase tracking-widest transition-all hard-shadow bg-surface-container-low">
                    Back
                </button>
<button class="flex-1 border-2 border-primary py-sm px-md font-label-md text-label-md uppercase tracking-widest transition-all hover:bg-secondary-fixed">
                    Skip Step
                </button>
</div>
</div>
</footer>
<script>
        const micBtn = document.getElementById('mic-button');
        const micStatus = document.getElementById('mic-status');
        let isRecording = false;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micBtn.classList.add('mic-active');
                micBtn.style.backgroundColor = '#7c2d12'; // primary-container
                micStatus.textContent = 'Recording...';
                micStatus.classList.add('animate-pulse');
            } else {
                micBtn.classList.remove('mic-active');
                micBtn.style.backgroundColor = '';
                micStatus.textContent = 'Recording Captured';
                micStatus.classList.remove('animate-pulse');
                setTimeout(() => {
                    micStatus.textContent = 'Tap to speak again';
                }, 2000);
            }
        });
    </script>
