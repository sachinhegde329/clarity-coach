<script>
    const startBtn = document.getElementById('start-btn');
    const circle = document.getElementById('visual-circle');
    const indicator = document.getElementById('breath-indicator');
    const progress = document.getElementById('progress-tick');
    
    let isRunning = false;
    let breathPhase = 0; // 0: Inhale, 1: Hold, 2: Exhale, 3: Hold

    function runMetronome() {
      if (!isRunning) return;

      const phases = ['Inhale', 'Hold', 'Exhale', 'Hold'];
      indicator.innerText = phases[breathPhase];

      // Update Visuals
      if (breathPhase === 0) {
        circle.style.transform = 'scale(1.2)';
        circle.style.borderColor = 'var(--tw-primary)';
        progress.style.transition = 'width 4000ms linear';
        progress.style.width = '100%';
      } else if (breathPhase === 2) {
        circle.style.transform = 'scale(0.8)';
        progress.style.transition = 'width 4000ms linear';
        progress.style.width = '0%';
      }

      breathPhase = (breathPhase + 1) % 4;
      setTimeout(runMetronome, 4000);
    }

    startBtn.addEventListener('click', () => {
      if (!isRunning) {
        isRunning = true;
        startBtn.innerText = 'Stop';
        startBtn.classList.remove('bg-primary');
        startBtn.classList.add('bg-secondary');
        runMetronome();
      } else {
        isRunning = false;
        startBtn.innerText = 'Begin Exercise';
        startBtn.classList.add('bg-primary');
        startBtn.classList.remove('bg-secondary');
        indicator.innerText = 'Ready';
        circle.style.transform = 'scale(1)';
        progress.style.width = '0%';
      }
    });
  </script>
