                      "on-secondary": "#ffffff",

                      "secondary-fixed-dim": "#bfcab4",
                      "success-sage": "#818C78",
                      "secondary": "#57624f",

                      "on-secondary-container": "#5b6653",

                      "on-secondary-fixed-variant": "#404a39",
                      "outline": "#89726c",

              "borderRadius": {

              "spacing": {

<style>
        body {
            background-color: #FDF9F5;
            color: #1c1c19;
            font-family: 'Bricolage Grotesque', sans-serif;
        }
        .border-heavy {
            border-width: 2px;
            border-color: #7C2D12;
            border-style: solid;
        }
        .border-hairline {
            border-width: 0.5px;
            border-color: #7C2D12;
            border-style: solid;
        }
        .recording-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .progress-indicator.active {
            background-color: #5e1700;
            color: #FDF9F5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface flex flex-col min-h-screen font-body-md text-on-surface pb-20 md:pb-0 pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 flex justify-between items-center px-margin-desktop h-16 w-full z-50 bg-surface border-b-border-width-thick border-primary flat no shadows">
<div class="flex items-center gap-4 cursor-pointer active:translate-y-px text-primary">
<span class="material-symbols-outlined font-headline-md text-headline-md">menu</span>
</div>
<div class="font-headline-md text-headline-md font-bold tracking-tight text-primary">
            CLARITY COACH
        </div>
<div class="flex items-center cursor-pointer active:translate-y-px hover:bg-surface-container-highest transition-colors duration-150 p-2 rounded">
<span class="material-symbols-outlined text-primary">account_circle</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-gutter md:p-margin-desktop w-full max-w-4xl mx-auto gap-8 relative z-10">
<!-- Progress Strip -->
<div class="w-full flex justify-between items-center border-heavy bg-surface-parchment rounded p-2 mb-8">
<div class="flex-1 text-center font-metric-sm text-metric-sm text-on-surface-variant border-r-hairline py-1">01</div>
<div class="flex-1 text-center font-metric-sm text-metric-sm text-on-surface-variant border-r-hairline py-1">02</div>
<div class="flex-1 text-center font-metric-sm text-metric-sm text-on-surface-variant border-r-hairline py-1">03</div>
<div class="flex-1 text-center font-metric-sm text-metric-sm text-on-surface-variant border-r-hairline py-1">04</div>
<div class="flex-1 text-center font-metric-sm text-metric-sm bg-primary text-surface py-1 px-4">05 COMMIT</div>
</div>
<!-- Session Meta -->
<div class="text-center mb-4">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-2">Session 15</h2>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">Signposting</h1>
</div>
<!-- Main Prompt Card -->
<div class="border-heavy bg-surface-parchment rounded p-8 w-full relative z-20 flex flex-col items-center justify-center min-h-[300px]">
<p class="font-body-lg text-body-lg text-on-surface text-center max-w-lg mb-12">
                "Tomorrow I will signal my structure before..."
            </p>
<!-- Mic Button Container -->
<div class="relative flex items-center justify-center mt-8">
<!-- Decorative Timer Ring -->
<svg class="absolute w-24 h-24 -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-surface-variant" cx="50" cy="50" fill="none" r="48" stroke-width="2"></circle>
<circle class="stroke-primary" cx="50" cy="50" fill="none" r="48" stroke-dasharray="301.59" stroke-dashoffset="150" stroke-width="2"></circle>
</svg>
<!-- Pulse Effect (Simulated Recording State via JS toggle) -->
<div class="absolute w-16 h-16 rounded-full bg-primary-fixed opacity-0 pointer-events-none" id="pulse-ring"></div>
<button class="w-16 h-16 rounded-full bg-primary border-heavy border-primary text-surface flex items-center justify-center relative z-10 active:scale-95 transition-transform" id="mic-btn">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<div class="mt-4 font-metric-sm text-metric-sm text-on-surface-variant font-mono">
                00:15 / LIMIT
            </div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface border-t-border-width-thick border-primary flat no shadows">
<div class="flex flex-col items-center justify-center bg-primary text-surface h-full w-full active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">calendar_today</span>
<span class="font-label-caps text-label-caps uppercase">Today</span>
</div>
<div class="flex flex-col items-center justify-center text-primary h-full w-full hover:bg-surface-container-high transition-all active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">architecture</span>
<span class="font-label-caps text-label-caps uppercase">Journey</span>
</div>
<div class="flex flex-col items-center justify-center text-primary h-full w-full hover:bg-surface-container-high transition-all active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">menu_book</span>
<span class="font-label-caps text-label-caps uppercase">Library</span>
</div>
<div class="flex flex-col items-center justify-center text-primary h-full w-full hover:bg-surface-container-high transition-all active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">query_stats</span>
<span class="font-label-caps text-label-caps uppercase">Stats</span>
</div>
</nav>
<script>
        document.getElementById('mic-btn').addEventListener('click', function() {
            const pulse = document.getElementById('pulse-ring');
            if (pulse.classList.contains('recording-pulse')) {
                pulse.classList.remove('recording-pulse');
                pulse.style.opacity = '0';
                this.classList.remove('bg-error-warning');
                this.classList.add('bg-primary');
            } else {
                pulse.classList.add('recording-pulse');
                this.classList.add('bg-error-warning');
                this.classList.remove('bg-primary');
            }
        });
    </script>
</body></html>
