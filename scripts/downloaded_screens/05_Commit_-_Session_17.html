<!-- Bottom Nav Bar (Suppressed on this linear/transactional session flow screen) -->
<script>
        // Simple mic pulse interaction
        const micBtn = document.getElementById('micBtn');
        const pulseRing = document.getElementById('pulseRing');
        let isRecording = false;
        let pulseInterval;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            
            if (isRecording) {
                micBtn.classList.replace('bg-primary', 'bg-error-warning');
                micBtn.querySelector('.material-symbols-outlined').textContent = 'mic_off';
                
                // Start pulse animation
                pulseInterval = setInterval(() => {
                    pulseRing.animate([
                        { transform: 'scale(1)', opacity: 0.8 },
                        { transform: 'scale(1.5)', opacity: 0 }
                    ], {
                        duration: 1000,
                        easing: 'ease-out'
                    });
                }, 1000);
            } else {
                micBtn.classList.replace('bg-error-warning', 'bg-primary');
                micBtn.querySelector('.material-symbols-outlined').textContent = 'mic';
                clearInterval(pulseInterval);
            }
        });
    </script>
