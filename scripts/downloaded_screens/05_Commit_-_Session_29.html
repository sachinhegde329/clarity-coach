<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

<!-- Micro-interaction JS -->
<script>
        const recordBtn = document.getElementById('record-btn');
        const micAssembly = document.getElementById('mic-assembly');
        const recordingDots = document.getElementById('recording-dots');
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micAssembly.classList.add('mic-recording');
                recordingDots.classList.remove('opacity-0');
                recordingDots.classList.add('opacity-100');
                // Change icon to square (stop)
                recordBtn.querySelector('span').textContent = 'square';
                // Transition button color slightly to indicate active state visually against brutalist background
                recordBtn.classList.remove('bg-primary');
                recordBtn.classList.add('bg-error-warning', 'border-error-warning');
            } else {
                micAssembly.classList.remove('mic-recording');
                recordingDots.classList.remove('opacity-100');
                recordingDots.classList.add('opacity-0');
                // Revert icon to mic
                recordBtn.querySelector('span').textContent = 'mic';
                recordBtn.classList.add('bg-primary');
                recordBtn.classList.remove('bg-error-warning', 'border-error-warning');
            }
        });
    </script>
