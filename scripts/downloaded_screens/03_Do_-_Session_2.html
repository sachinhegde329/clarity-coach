<script>
        const recordBtn = document.getElementById('record-btn');
        const micIcon = document.getElementById('mic-icon');
        const timerText = document.getElementById('timer-text');
        const timerRing = document.getElementById('timer-ring');
        const instructionText = document.getElementById('instruction-text');
        
        let timeLeft = 60;
        let isRecording = false;
        let timerInterval;
        const totalLength = 283; // 2 * PI * r (45)

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const offset = totalLength - (timeLeft / 60) * totalLength;
            timerRing.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                stopRecording();
            }
            timeLeft--;
        }

        function startRecording() {
            isRecording = true;
            recordBtn.classList.add('recording-pulse');
            recordBtn.classList.add('bg-secondary-fixed');
            micIcon.innerText = 'stop';
            micIcon.setAttribute('data-icon', 'stop');
            instructionText.innerText = 'Recording... speak naturally.';
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);
            recordBtn.classList.remove('recording-pulse');
            recordBtn.classList.remove('bg-secondary-fixed');
            micIcon.innerText = 'check';
            micIcon.setAttribute('data-icon', 'check');
            instructionText.innerText = 'Perfect. Insight captured.';
            
            setTimeout(() => {
                alert('Session Step 03 Complete. Ready for Step 04?');
            }, 1000);
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });
    </script>
