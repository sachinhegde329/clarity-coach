<script>
        // Simple breathing rhythm instruction update
        document.addEventListener('DOMContentLoaded', () => {
            const phaseText = document.createElement('div');
            phaseText.className = 'font-label-caps text-label-caps text-primary mt-4 absolute bottom-4 text-center w-full transition-opacity duration-1000';
            document.querySelector('.w-64.h-64').appendChild(phaseText);

            const phases = ['Inhale...', 'Hold...', 'Exhale...'];
            let currentPhase = 0;

            setInterval(() => {
                phaseText.style.opacity = 0;
                setTimeout(() => {
                    phaseText.textContent = phases[currentPhase];
                    phaseText.style.opacity = 1;
                    currentPhase = (currentPhase + 1) % phases.length;
                }, 500); // Wait for fade out
            }, 4000); // 4 seconds per phase matching CSS animation
            
            // Initial setting
            phaseText.textContent = phases[0];
            phaseText.style.opacity = 1;
        });
    </script>
