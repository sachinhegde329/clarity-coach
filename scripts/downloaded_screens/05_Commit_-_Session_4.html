</div>

        </a>

<div class="fixed top-0 right-0 w-48 h-48 border-l-2 border-b-2 border-primary opacity-20 pointer-events-none"></div>
<script>
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const pulseLayer = document.getElementById('pulse-layer');
        const instructionText = document.getElementById('instruction-text');
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer');

        let isRecording = false;
        let countdown;

        micBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        function startRecording() {
            isRecording = true;
            micIcon.innerText = 'stop';
            micIcon.classList.add('text-error');
            micBtn.classList.add('border-error');
            pulseLayer.classList.remove('hidden');
            instructionText.innerText = 'Recording...';
            instructionText.classList.add('text-error');
            timerContainer.classList.remove('hidden');
            
            let timeLeft = 15;
            countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `0:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                if (timeLeft <= 0) {
                    stopRecording();
                }
            }, 1000);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(countdown);
            micIcon.innerText = 'check';
            micIcon.classList.remove('text-error');
            micIcon.classList.add('text-tertiary-container');
            micBtn.classList.remove('border-error');
            micBtn.classList.add('border-tertiary-container');
            pulseLayer.classList.add('hidden');
            instructionText.innerText = 'Commitment Captured';
            instructionText.classList.remove('text-error');
            instructionText.classList.add('text-tertiary-container');
            timerContainer.classList.add('hidden');
        }
    </script>
