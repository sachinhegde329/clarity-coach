<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Commit Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "surface": "#fdf9f5",
                    "on-tertiary-container": "#ff998e",
                    "surface-container-low": "#f7f3ef",
                    "on-tertiary-fixed-variant": "#93000b",
                    "error": "#ba1a1a",
                    "border-primary": "#7C2D12",
                    "surface-container": "#f1ede9",
                    "on-surface-variant": "#55423d",
                    "outline-variant": "#dcc1b9",
                    "on-primary-container": "#ff9b7b",
                    "on-error": "#ffffff",
                    "surface-variant": "#e5e2de",
                    "surface-tint": "#9b4427",
                    "on-secondary-container": "#5b6653",
                    "background": "#fdf9f5",
                    "inverse-surface": "#31302e",
                    "secondary-fixed-dim": "#bfcab4",
                    "surface-dim": "#ddd9d6",
                    "surface-container-high": "#ebe7e4",
                    "on-secondary-fixed": "#151e10",
                    "surface-bright": "#fdf9f5",
                    "on-primary-fixed-variant": "#7c2d12",
                    "secondary": "#57624f",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#ffdbd0",
                    "surface-container-highest": "#e5e2de",
                    "primary-container": "#7c2d12",
                    "error-warning": "#B91C1C",
                    "tertiary": "#680005",
                    "success-sage": "#818C78",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#ffb59e",
                    "on-tertiary": "#ffffff",
                    "primary": "#5e1700",
                    "tertiary-fixed": "#ffdad6",
                    "secondary-fixed": "#dbe6cf",
                    "on-secondary-fixed-variant": "#404a39",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f4f0ec",
                    "on-surface": "#1c1c19",
                    "outline": "#89726c",
                    "tertiary-fixed-dim": "#ffb4ab",
                    "on-secondary": "#ffffff",
                    "on-background": "#1c1c19",
                    "primary-fixed-dim": "#ffb59e",
                    "secondary-container": "#d8e3cc",
                    "surface-parchment": "#FDF9F5",
                    "on-tertiary-fixed": "#410002",
                    "on-primary-fixed": "#3a0b00",
                    "tertiary-container": "#93000b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "border-width": "2px",
                    "margin-desktop": "40px",
                    "unit": "4px",
                    "gutter": "16px",
                    "hairline": "0.5px"
            },
            "fontFamily": {
                    "headline-md": ["Bricolage Grotesque"],
                    "metric-hero": ["JetBrains Mono"],
                    "display-lg": ["Bricolage Grotesque"],
                    "headline-lg": ["Bricolage Grotesque"],
                    "body-lg": ["Bricolage Grotesque"],
                    "metric-sm": ["JetBrains Mono"],
                    "body-md": ["Bricolage Grotesque"],
                    "label-caps": ["JetBrains Mono"]
            },
            "fontSize": {
                    "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                    "metric-hero": ["40px", { "lineHeight": "40px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                    "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "metric-sm": ["14px", { "lineHeight": "16px", "fontWeight": "500" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
<style>
        body { background-color: theme('colors.surface'); color: theme('colors.on-surface'); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="fixed w-full top-0 z-50 bg-surface border-b-2 border-primary-container flex justify-between items-center px-margin-mobile py-4">
<button class="flex items-center justify-center w-10 h-10 hover:bg-surface-variant transition-colors active:scale-95 duration-100 rounded">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">05 / 05</h1>
<div class="font-label-caps text-label-caps text-on-surface-variant flex items-center justify-center w-10 h-10">
            04:18
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile pt-[88px] pb-[96px]">
<div class="w-full max-w-md flex flex-col gap-10">
<!-- Session Progress Strip -->
<div class="flex gap-2 w-full px-4">
<div class="h-2 flex-1 border-hairline border-outline-variant bg-surface-variant"></div>
<div class="h-2 flex-1 border-hairline border-outline-variant bg-surface-variant"></div>
<div class="h-2 flex-1 border-hairline border-outline-variant bg-surface-variant"></div>
<div class="h-2 flex-1 border-hairline border-outline-variant bg-surface-variant"></div>
<div class="h-2 flex-1 border-border-width border-primary bg-primary-container"></div>
</div>
<!-- Header -->
<div class="text-center">
<h2 class="font-display-lg text-display-lg text-primary">Commit</h2>
</div>
<!-- The Prompt Card (Warm Brutalist) -->
<div class="bg-surface-parchment border-border-width border-primary rounded-DEFAULT p-8 shadow-[4px_4px_0px_0px_rgba(124,45,18,0.1)] relative">
<p class="font-body-lg text-body-lg text-on-surface leading-loose text-center">
                    Pressure cost me <span class="inline-block w-20 border-b-border-width border-primary mx-1 translate-y-[2px]"></span>.<br/>
                    Next time I will <span class="inline-block w-20 border-b-border-width border-primary mx-1 translate-y-[2px]"></span>.
                </p>
<!-- Decorative brutalist corner markers -->
<div class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-primary -translate-x-[2px] -translate-y-[2px]"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-primary translate-x-[2px] translate-y-[2px]"></div>
</div>
<!-- Action Area -->
<div class="flex flex-col items-center gap-6 mt-4">
<button class="w-16 h-16 rounded-full bg-primary flex items-center justify-center hover:bg-surface-tint transition-colors active:scale-95 duration-100 relative group border-border-width border-primary shadow-[0_0_0_2px_rgba(253,249,245,1),0_0_0_4px_rgba(124,45,18,0.2)]">
<span class="material-symbols-outlined text-surface-parchment text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest text-center">
                    Tap to speak your commitment
                </p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface border-t-2 border-primary-container h-20 pb-safe">
<button class="flex flex-col items-center justify-center bg-primary-container text-surface-parchment rounded-xl px-4 py-1 hover:bg-surface-container-high hover:text-on-surface-variant transition-colors active:translate-y-[-2px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">today</span>
<span class="font-label-caps text-label-caps mt-1">TODAY</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:translate-y-[-2px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">map</span>
<span class="font-label-caps text-label-caps mt-1">JOURNEY</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:translate-y-[-2px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu_book</span>
<span class="font-label-caps text-label-caps mt-1">LIBRARY</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:translate-y-[-2px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">bar_chart</span>
<span class="font-label-caps text-label-caps mt-1">STATS</span>
</button>
</nav>
</body></html>
