<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clarity Coach - Commit</title>

        tailwind.config = {
            darkMode: "class",

                        "primary": "#5e1700",
                        "inverse-surface": "#31302e",
                        "error-warning": "#B91C1C",
                        "on-primary-fixed": "#3a0b00",

                        "error": "#ba1a1a",
                        "surface": "#fdf9f5",
                        "on-tertiary-fixed-variant": "#93000b",
                        "background": "#fdf9f5",
                        "surface-bright": "#fdf9f5",
                        "on-surface-variant": "#55423d",
                        "on-tertiary-fixed": "#410002",
                        "tertiary": "#680005",
                        "surface-dim": "#ddd9d6",
                        "on-primary-fixed-variant": "#7c2d12",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#404a39",
                        "outline-variant": "#dcc1b9",
                        "inverse-primary": "#ffb59e",
                        "surface-container-highest": "#e5e2de",
                        "inverse-on-surface": "#f4f0ec",
                        "tertiary-fixed-dim": "#ffb4ab",
                        "primary-fixed": "#ffdbd0",
                        "surface-variant": "#e5e2de",
                        "on-secondary-fixed": "#151e10",
                        "surface-container": "#f1ede9",
                        "secondary-fixed": "#dbe6cf",
                        "on-secondary-container": "#5b6653",
                        "tertiary-fixed": "#ffdad6",
                        "outline": "#89726c",
                        "success-sage": "#818C78",
                        "secondary-fixed-dim": "#bfcab4",
                        "surface-tint": "#9b4427",
                        "surface-container-low": "#f7f3ef",
                        "on-primary-container": "#ff9b7b",
                        "primary-fixed-dim": "#ffb59e",
                        "on-error": "#ffffff",
                        "on-background": "#1c1c19",
                        "on-error-container": "#93000a",
                        "secondary-container": "#d8e3cc",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1c1c19",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "secondary": "#57624f",
                        "on-tertiary-container": "#ff998e",
                        "border-primary": "#7C2D12",
                        "surface-container-lowest": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "hairline": "0.5px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "border-width": "2px",
                        "unit": "4px"
                    },
                    fontFamily: {
                        "metric-sm": ["JetBrains Mono"],
                        "body-lg": ["Bricolage Grotesque"],
                        "body-md": ["Bricolage Grotesque"],
                        "label-caps": ["JetBrains Mono"],

                    },
                    fontSize: {
                        "metric-sm": ["14px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],

                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],

                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }

<style>
        /* Base styles forcing the parchment/brutalist feel */
        body {
            background-color: theme('colors.surface-parchment');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Brutalist structural grid line */
        .grid-bg {
            background-image: linear-gradient(theme('colors.outline-variant') 0.5px, transparent 0.5px),
                              linear-gradient(90deg, theme('colors.outline-variant') 0.5px, transparent 0.5px);
            background-size: 32px 32px;
            background-position: center center;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Mic pulse animation */
        @keyframes brutalist-pulse {
            0% { transform: scale(1); opacity: 1; border-color: theme('colors.primary'); }
            50% { transform: scale(1.1); opacity: 0.8; border-color: theme('colors.primary-container'); }
            100% { transform: scale(1); opacity: 1; border-color: theme('colors.primary'); }
        }
        .mic-active {
            animation: brutalist-pulse 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col relative selection:bg-primary-fixed selection:text-primary">
<!-- Subtle architectural grid overlay -->
<div class="fixed inset-0 grid-bg z-0"></div>
<div class="relative z-10 flex flex-col min-h-screen px-margin-mobile md:px-margin-desktop py-8 max-w-3xl mx-auto w-full">
<!-- Header / Progress Marker -->
<header class="flex justify-between items-end border-b-2 border-primary pb-4 mb-8">
<div class="flex flex-col gap-1">
<span class="font-label-caps text-secondary uppercase tracking-widest">Session 24</span>
<span class="font-headline-md text-primary">Pressure Replay</span>
</div>
<div class="flex items-center gap-2">
<div class="flex gap-1 h-2 w-16">
<!-- Progress representation: 5 solid blocks -->
<div class="flex-1 bg-primary border border-primary"></div>
<div class="flex-1 bg-primary border border-primary"></div>
<div class="flex-1 bg-primary border border-primary"></div>
<div class="flex-1 bg-primary border border-primary"></div>
<div class="flex-1 bg-primary border border-primary"></div>
</div>
<span class="font-metric-sm text-primary ml-2">05 / 05</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col justify-center gap-10">
<!-- Context & Prompt -->
<section class="space-y-4">
<div class="inline-block px-2 py-1 border-2 border-primary bg-primary-fixed text-primary font-label-caps uppercase tracking-widest">
                    Step 5: Commit
                </div>
<h1 class="font-display-lg text-primary leading-tight">
                    What pressure am I now ready for?
                </h1>
</section>
<!-- Action Zone (Card on Card Layering) -->
<section class="relative mt-4">
<!-- Background shadow block (Brutalist offset) -->
<div class="absolute inset-0 translate-x-2 translate-y-2 border-2 border-primary bg-surface-container-high rounded-DEFAULT pointer-events-none"></div>
<!-- Foreground interactive card -->
<div class="relative bg-surface-parchment border-2 border-primary p-6 md:p-10 rounded-DEFAULT flex flex-col items-center gap-8">
<!-- Suggested Opener Area -->
<div class="w-full text-center border-b-[0.5px] border-primary pb-8">
<p class="font-label-caps text-secondary mb-3 uppercase tracking-widest">Suggested Opener</p>
<p class="font-headline-lg text-on-surface-variant italic">"I am ready for..."</p>
</div>
<!-- Mic Interaction -->
<div class="flex flex-col items-center gap-4 pt-4">
<button class="w-[64px] h-[64px] rounded-full bg-primary flex items-center justify-center border-2 border-primary hover:bg-primary-container transition-colors relative group focus:outline-none focus:ring-4 focus:ring-primary-fixed" id="micBtn">
<!-- Timer/Pulse Ring Indicator -->
<div class="absolute inset-[-6px] rounded-full border-2 border-outline-variant group-hover:border-primary transition-colors"></div>
<span class="material-symbols-outlined text-surface-parchment" style="font-size: 32px; font-variation-settings: 'FILL' 1;">mic</span>
</button>
<span class="font-label-caps text-primary uppercase tracking-widest">Tap to vocalize</span>
</div>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="mt-12 pt-6 border-t-[0.5px] border-primary">
<button class="w-full py-4 bg-primary border-2 border-primary text-surface-parchment font-headline-md rounded-DEFAULT hover:bg-inverse-surface hover:border-inverse-surface transition-colors active:translate-y-1">
                Finish Sprint 4
            </button>
</footer>
</div>
<script>
        // Simple interaction for the mic button to demonstrate state
        const micBtn = document.getElementById('micBtn');
        let isRecording = false;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            const ring = micBtn.querySelector('div');
            
            if (isRecording) {
                ring.classList.add('mic-active');
                ring.classList.replace('border-outline-variant', 'border-error-warning');
            } else {
                ring.classList.remove('mic-active');
                ring.classList.replace('border-error-warning', 'border-outline-variant');
            }
        });
    </script>
</body></html>
