            </div>

<!-- SVG Ring for Timer -->
<svg class="absolute w-32 h-32 -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="#e5e2de" stroke-width="2"></circle>
<circle class="timer-ring" cx="50" cy="50" fill="none" id="timer-circle" r="48" stroke="#7C2D12" stroke-width="2"></circle>
</svg>
<!-- The Mic Button -->
<button class="w-24 h-24 rounded-full bg-primary border-border-width border-primary flex items-center justify-center text-surface-parchment hover:bg-primary-container transition-colors active:scale-95 group relative z-10" id="record-btn">
<span class="material-symbols-outlined text-4xl" id="mic-icon" style="font-variation-settings: 'FILL' 1;">mic</span>

                Press to commit
            </p>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('record-btn');
            const icon = document.getElementById('mic-icon');
            const timerCircle = document.getElementById('timer-circle');
            const timerDisplay = document.getElementById('timer-display');
            let isRecording = false;
            let timerInterval;
            let timeLeft = 15;
            const circumference = 2 * Math.PI * 48; // r=48 from svg

            timerCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            timerCircle.style.strokeDashoffset = '0';

            function setProgress(percent) {
                const offset = circumference - percent / 100 * circumference;
                timerCircle.style.strokeDashoffset = offset;
            }

            btn.addEventListener('click', () => {
                if(!isRecording) {
                    // Start Recording
                    isRecording = true;
                    btn.classList.add('mic-pulse');
                    icon.textContent = 'stop';
                    
                    timeLeft = 15;
                    timerDisplay.textContent = `0:${timeLeft}`;
                    setProgress(100);

                    timerInterval = setInterval(() => {
                        timeLeft--;
                        if(timeLeft >= 0) {
                            timerDisplay.textContent = `0:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
                            setProgress((timeLeft / 15) * 100);
                        } else {
                            stopRecording();
                        }
                    }, 1000);

                } else {
                    stopRecording();
                }
            });

            function stopRecording() {
                isRecording = false;
                btn.classList.remove('mic-pulse');
                icon.textContent = 'mic';
                clearInterval(timerInterval);
                timerDisplay.textContent = 'DONE';
                setProgress(0);
                setTimeout(() => {
                    timerDisplay.textContent = '0:15';
                    setProgress(100);
                }, 2000);
            }
        });
    </script>
