<style>
        /* Base styling */
        body {
            background-color: theme('colors.surface-parchment');
            color: theme('colors.on-surface');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Brutalist component classes */
        .brutalist-card {
            border: theme('spacing.border-width') solid theme('colors.border-primary');
            background-color: theme('colors.surface-parchment');
            border-radius: theme('borderRadius.lg');
            box-shadow: none; /* explicitly rejecting soft shadows */
        }

        .brutalist-card-nested {
            border: theme('spacing.hairline') solid theme('colors.border-primary');
            background-color: theme('colors.surface-container-low');
            border-radius: theme('borderRadius.DEFAULT');
        }

        .brutalist-button {
            background-color: theme('colors.border-primary');
            border: theme('spacing.border-width') solid theme('colors.border-primary');
            border-radius: theme('borderRadius.lg');
            color: theme('colors.surface-parchment');
            transition: all 150ms ease-in-out;
        }
        
        .brutalist-button:active {
            transform: scale(0.98);
        }

        .brutalist-button-ghost {
            background-color: transparent;
            border: theme('spacing.border-width') solid theme('colors.border-primary');
            border-radius: theme('borderRadius.lg');
            color: theme('colors.border-primary');
        }

        /* Mic Button Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        .mic-recording::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid theme('colors.border-primary');
            animation: pulse-ring 1.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        /* Progress Bar */
        .progress-bar-container {
            height: 4px;
            background-color: theme('colors.surface-variant');
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 50;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: theme('colors.border-primary');
            width: 100%; /* Step 5 of 5 */
            transition: width 0.3s ease;
        }

<body class="bg-surface-parchment antialiased">

<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter md:p-margin-desktop max-w-4xl mx-auto w-full gap-8 relative pb-24">

                    Speak your commitment for the next interaction. Finish this sentence:
                </p>
<blockquote class="brutalist-card-nested p-6 font-headline-md text-headline-md text-primary italic relative">
<span class="material-symbols-outlined absolute -top-4 -left-4 text-surface-tint bg-surface-container-low rounded-full p-1 border-hairline border-border-primary" style="font-size: 32px;">format_quote</span>

                </blockquote>
</div>

<div class="w-full flex flex-col items-center justify-center gap-6 mt-8">

<span class="material-symbols-outlined text-surface-tint">timer</span>
<span id="timer-display">15.0</span><span class="text-on-surface-variant text-xl">s</span>
</div>
<!-- Mic Button Container -->
<div class="relative w-32 h-32 flex items-center justify-center">
<!-- The Mic Button -->
<button aria-label="Start recording commitment" class="w-20 h-20 rounded-full bg-border-primary text-surface-parchment flex items-center justify-center shadow-none border-2 border-border-primary relative z-10 transition-transform active:scale-95 focus:outline-none focus:ring-4 focus:ring-primary-fixed-dim" id="mic-btn">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>

</div>
</main>
<!-- Bottom Progress Bar -->
<div class="progress-bar-container">
<div class="progress-bar-fill"></div>
</div>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('mic-btn');
            const timerDisplay = document.getElementById('timer-display');
            let isRecording = false;
            let timerInterval;
            let timeLeft = 15.0;

            micBtn.addEventListener('click', () => {
                isRecording = !isRecording;
                
                if (isRecording) {
                    micBtn.classList.add('mic-recording');
                    micBtn.classList.replace('bg-border-primary', 'bg-error');
                    micBtn.classList.replace('border-border-primary', 'border-error');
                    
                    // Simple timer logic
                    timerInterval = setInterval(() => {
                        timeLeft -= 0.1;
                        if (timeLeft <= 0) {
                            timeLeft = 0;
                            stopRecording();
                        }
                        timerDisplay.textContent = timeLeft.toFixed(1);
                    }, 100);
                } else {
                    stopRecording();
                }
            });

            function stopRecording() {
                isRecording = false;
                micBtn.classList.remove('mic-recording');
                micBtn.classList.replace('bg-error', 'bg-border-primary');
                micBtn.classList.replace('border-error', 'border-border-primary');
                clearInterval(timerInterval);
                timeLeft = 15.0; // Reset for demo purposes
                timerDisplay.textContent = timeLeft.toFixed(1);
            }
        });
    </script>
