<style>
        /* Custom animations for the recording state */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80% { transform: scale(1.2); opacity: 0; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        @keyframes waveform {
            0% { height: 10%; }
            50% { height: 100%; }
            100% { height: 10%; }
        }
        .mic-pulse::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px dashed #9b4427; /* surface-tint */
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            opacity: 0;
            pointer-events: none;
        }
        .waveform-bar {
            width: 4px;
            background-color: #7C2D12; /* border-primary */
            margin: 0 2px;
            border-radius: 2px;
            animation: waveform 1s infinite ease-in-out;
        }
        /* Stagger waveform animation */
        .waveform-bar:nth-child(1) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(2) { animation-delay: 0.3s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.0s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(6) { animation-delay: 0.5s; }
        .waveform-bar:nth-child(7) { animation-delay: 0.1s; }
        
        /* Depleting ring using conic-gradient (simulate 45s left out of 60s) */
        .timer-ring {
            background: conic-gradient(#7C2D12 75%, transparent 75%);
            border-radius: 50%;
        }
    </style>
