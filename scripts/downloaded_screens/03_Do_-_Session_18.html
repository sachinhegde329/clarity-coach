<style>
        /* Custom Keyframes for Brutalist Animations */
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes waveform {
            0% { transform: scaleY(0.2); }
            50% { transform: scaleY(1); }
            100% { transform: scaleY(0.2); }
        }
        .wave-bar {
            transform-origin: bottom;
            animation: waveform 1s ease-in-out infinite alternate;
        }

<h1 class="font-display-lg text-display-lg text-on-surface mb-8">Do - Hot Seat</h1>
<!-- Adversarial AI Card (Card-on-Card Layering) -->
<div class="relative bg-surface-parchment border-[2px] border-border-primary p-6 rounded mb-8">
<!-- Brutalist internal hairline nesting -->
<div class="absolute inset-[6px] border-[0.5px] border-outline pointer-events-none opacity-40"></div>
<div class="relative z-10 flex items-center gap-3 mb-6">
<div class="w-8 h-8 rounded bg-inverse-surface flex items-center justify-center">

</div>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">Adversarial Prompt</span>
</div>

                    "Your proposed timeline is aggressive. How can you guarantee quality without burning out the team?"
                </p>

                RESPOND IN 30 SECONDS
            </div>
<!-- The Mic Button & Timer Ring -->
<div class="relative flex justify-center items-center w-32 h-32 mb-6">
<!-- Timer Ring (Depleting) -->
<svg class="absolute inset-0 w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-surface-container-high" cx="50" cy="50" fill="none" r="46" stroke-width="2"></circle>
<!-- stroke-dasharray = 2 * PI * r = ~289 -->
<circle class="stroke-border-primary" cx="50" cy="50" fill="none" r="46" stroke-dasharray="289" stroke-dashoffset="80" stroke-linecap="square" stroke-width="4"></circle>
</svg>
<!-- Mic Button (64pt -> 85px) -->
<button class="w-[85px] h-[85px] rounded-full bg-primary-container flex items-center justify-center relative z-10 transition-transform hover:scale-105 active:scale-95 group focus:outline-none focus:ring-4 focus:ring-primary-fixed">
<!-- Pulse effect indicating listening state -->
<span class="absolute inset-0 rounded-full border-[2px] border-primary-container animate-pulse-ring pointer-events-none"></span>
<span class="absolute inset-0 rounded-full border-[1px] border-primary-container animate-pulse-ring pointer-events-none" style="animation-delay: 0.5s;"></span>
<span class="material-symbols-outlined text-surface text-3xl transition-transform group-hover:scale-110" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>

</div>

</main>
<script>
        // Generate brutalist sparkline
        const sparklineContainer = document.getElementById('sparkline-container');
        const numSparkBars = 40;
        for (let i = 0; i < numSparkBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'flex-1 bg-success-sage';
            // Baseline high composure with slight dips
            const height = 70 + Math.random() * 30; 
            bar.style.height = `${height}%`;
            bar.style.minHeight = '10%';
            sparklineContainer.appendChild(bar);
        }

        // Generate waveform bars
        const waveformContainer = document.getElementById('waveform-container');
        const numWaveBars = 24;
        for (let i = 0; i < numWaveBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'w-2 bg-primary-container wave-bar';
            bar.style.animationDelay = `${Math.random() * 0.5}s`;
            bar.style.animationDuration = `${0.5 + Math.random() * 0.8}s`;
            waveformContainer.appendChild(bar);
        }
    </script>
