<style>

            background-image: url('data:image/svg+xml,%3Csvg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23e5e2de" fill-opacity="0.4" fill-rule="evenodd"%3E%3Ccircle cx="3" cy="3" r="3"/%3E%3Ccircle cx="13" cy="13" r="3"/%3E%3C/g%3E%3C/svg%3E');

<body class="text-on-background font-body-md min-h-screen flex flex-col pt-16 pb-20 md:pb-0">

<button aria-label="Close" class="text-primary dark:text-primary-fixed-dim hover:bg-primary-container hover:text-on-primary-container p-2 rounded transition-colors">

<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>

<!-- Main Canvas -->

</div>
<!-- The Challenge Card (Warm Brutalist) -->
<div class="w-full max-w-2xl bg-surface-parchment border-2 border-border-primary rounded-lg p-6 md:p-8 mb-12 relative shadow-[4px_4px_0px_0px_rgba(124,45,18,1)] transition-transform hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_rgba(124,45,18,1)] duration-200">
<!-- Decorative corner elements indicating structure -->
<div class="absolute top-0 left-0 w-2 h-2 border-r-2 border-b-2 border-border-primary"></div>
<div class="absolute top-0 right-0 w-2 h-2 border-l-2 border-b-2 border-border-primary"></div>
<div class="absolute bottom-0 left-0 w-2 h-2 border-r-2 border-t-2 border-border-primary"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-l-2 border-t-2 border-border-primary"></div>
<h2 class="font-label-caps text-label-caps text-secondary mb-4 border-b border-outline-variant pb-2 inline-block">Selected Challenge</h2>
<div class="font-headline-lg text-headline-lg text-on-background mb-4">
                Hypothesis-Driven Practice
            </div>
<div class="bg-surface-variant border-[0.5px] border-outline p-4 rounded mt-6">
<span class="font-label-caps text-label-caps text-on-surface-variant block mb-2">Prompt:</span>
<p class="font-body-lg text-body-lg text-on-background italic">"Propose a major shift in your team's current workflow."</p>
</div>
</div>
<!-- Recording Interface -->
<div class="flex flex-col items-center justify-center gap-6 mt-4">
<!-- Timer Display (Data as Hero) -->
<div class="font-metric-hero text-metric-hero text-primary tracking-tighter tabular-nums bg-surface border-2 border-border-primary px-6 py-2 rounded-lg shadow-[2px_2px_0px_0px_rgba(124,45,18,1)]">
                00:00
            </div>
<!-- The Mic Button -->
<button aria-label="Start Recording" class="relative group mt-4 w-24 h-24 flex items-center justify-center rounded-full bg-primary-container text-surface border-2 border-primary transition-transform duration-200 hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-primary/30" id="mic-button">
<!-- Inner circle -->
<div class="absolute inset-2 rounded-full border-2 border-surface/30"></div>
<span class="material-symbols-outlined text-4xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
<!-- Timer Ring Placeholder (CSS only for now) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<circle class="opacity-20" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-width="2"></circle>
</svg>
</button>
<div class="font-label-caps text-label-caps text-on-surface-variant text-center mt-2 opacity-70">
                Tap to begin recording
            </div>
</div>
</main>
<script>
        // Simple micro-interaction for the mic button
        const micBtn = document.getElementById('mic-button');
        let isRecording = false;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micBtn.classList.add('pulse-ring');
                micBtn.classList.remove('bg-primary-container');
                micBtn.classList.add('bg-error-warning'); // Reddish-brown/warning color for active state
                micBtn.querySelector('span').textContent = 'stop';
            } else {
                micBtn.classList.remove('pulse-ring');
                micBtn.classList.add('bg-primary-container');
                micBtn.classList.remove('bg-error-warning');
                micBtn.querySelector('span').textContent = 'mic';
            }
        });
    </script>
