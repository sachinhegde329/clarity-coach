            background-color: theme('colors.surface-parchment');
            color: theme('colors.primary');

    body {
      min-height: max(884px, 100dvh);

<body class="min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- Top Navigation (Session Flow context, not standard TopAppBar) -->
<header class="w-full top-0 sticky bg-surface-parchment border-b-border-width border-primary z-10 px-margin-mobile md:px-margin-desktop py-gutter flex justify-between items-center">
<button aria-label="Close Session" class="text-primary hover:bg-surface-container transition-colors p-2 rounded-DEFAULT border-border-width border-transparent hover:border-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest">Session 24</span>
<span class="font-metric-sm text-metric-sm">01 / 05</span>
</div>
<button aria-label="Menu placeholder" class="text-primary hover:bg-surface-container transition-colors p-2 rounded-DEFAULT border-border-width border-transparent hover:border-primary invisible">
<span class="material-symbols-outlined">menu</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop gap-margin-desktop relative">
<!-- Headers -->
<div class="text-center flex flex-col gap-unit max-w-2xl mx-auto z-10">
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Step 1: Centre</h2>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Pressure Replay</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-gutter border-l-border-width border-primary pl-4 text-left md:text-center md:border-l-0 md:border-t-border-width md:pt-4">
                You have been pressured five times this sprint. You have learned something.
            </p>
</div>
<!-- Breathing Visual Element -->
<div class="relative w-64 h-64 my-12 flex items-center justify-center z-0">
<!-- Outermost ring -->
<div class="absolute inset-0 border-hairline border-outline-variant rounded-full opacity-50"></div>
<!-- Middle ring -->
<div class="absolute inset-4 border-hairline border-outline border-dashed rounded-full opacity-75"></div>
<!-- Breathing core -->
<div class="w-24 h-24 rounded-full border-border-width border-primary bg-surface-tint opacity-20 animate-breathe flex items-center justify-center">
<div class="w-12 h-12 rounded-full bg-primary absolute shadow-[0_0_40px_theme('colors.primary')]"></div>
</div>
<!-- Structural Crosshairs -->
<div class="absolute w-full h-[1px] bg-outline-variant opacity-30"></div>
<div class="absolute h-full w-[1px] bg-outline-variant opacity-30"></div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="w-full p-margin-mobile md:p-margin-desktop flex justify-center pb-12">
<button class="bg-primary text-on-primary border-border-width border-primary font-headline-md text-headline-md px-8 py-4 rounded-lg hover:bg-primary-container active:translate-y-1 transition-all shadow-[4px_4px_0px_0px_theme('colors.outline')] active:shadow-[0px_0px_0px_0px_theme('colors.outline')] flex items-center gap-2">
            Stay centered
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
