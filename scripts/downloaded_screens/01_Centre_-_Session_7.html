<style>
        body { background-color: #fdf9f5; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .breathing-circle {
            animation: breathe 8s ease-in-out infinite;
        }
        .brutal-shadow {
            box-shadow: 4px 4px 0px 0px #5e1700;
        }
        .brutal-button:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px 0px #5e1700;
        }
        .brutal-button:active {
            transform: translate(0px, 0px);
            box-shadow: 2px 2px 0px 0px #5e1700;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-background border-b-2 border-primary flat no shadows">
<div class="flex justify-between items-center w-full px-gutter h-16">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tighter uppercase">CLARITY COACH</h1>
<div class="px-3 py-1 border-2 border-primary font-label-md text-primary">
                01/05
            </div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter py-xl">
<!-- Session Header -->
<div class="w-full max-w-2xl mb-xl text-center">
<span class="font-label-md text-label-md text-primary uppercase border-b-2 border-primary pb-1">Session 7: Cutting Fillers</span>
<h2 class="font-headline-lg text-headline-lg text-primary mt-sm mb-xs uppercase">Step 01/05: Centre</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">You are about to try something hard. Settle in.</p>
</div>
<!-- Breathing Interface -->
<div class="relative flex items-center justify-center w-full max-w-md aspect-square">
<!-- Structural Geometry Background -->
<div class="absolute inset-0 border-2 border-outline-variant opacity-20 grid grid-cols-4 grid-rows-4">
<div class="border-r border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-r border-b border-outline-variant"></div>
<div class="border-b border-outline-variant"></div>
</div>
<!-- Outer Ring (Static Reference) -->
<div class="absolute w-64 h-64 border-2 border-primary opacity-10"></div>
<!-- The Breathing Pulse -->
<div class="breathing-circle relative w-48 h-48 bg-primary-container border-4 border-primary flex items-center justify-center">
<div class="absolute inset-0 border border-on-primary-container opacity-30 m-2"></div>
<span class="font-label-md text-label-md text-on-primary-container uppercase font-bold tracking-widest" id="breath-text">Inhale</span>
</div>
<!-- Decorative Accents -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary"></div>
</div>
<!-- Call to Action -->
<div class="mt-xl w-full max-w-xs">
<button class="brutal-button brutal-shadow w-full py-md bg-background border-2 border-primary font-label-md text-label-md text-primary uppercase font-bold transition-all flex items-center justify-center gap-xs">
                I am ready
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar (Suppressed for focused task, but kept placeholder structure if needed by instruction logic. Instruction says suppress if sub-page/task-focused. This is a focused exercise, but JSON mandates it if top-level. Given it's a 'Session', we'll treat it as a task and prioritize canvas.) -->
<!-- Instruction says: "Suppression: You MUST exclude the navigation shell if the page intent is Task-Focused" -->
<!-- So we skip BottomNavBar here to maintain focus on the breathing exercise. -->
<script>
        // Micro-interaction for the breathing text
        const breathText = document.getElementById('breath-text');
        let cycle = 0;
        setInterval(() => {
            cycle++;
            if (cycle % 2 === 0) {
                breathText.innerText = 'Inhale';
                breathText.style.letterSpacing = '0.2em';
            } else {
                breathText.innerText = 'Exhale';
                breathText.style.letterSpacing = '0.05em';
            }
        }, 4000);

        // Interaction for the button
        document.querySelector('.brutal-button').addEventListener('click', function() {
            this.style.backgroundColor = 'var(--secondary-container)';
            setTimeout(() => {
                this.style.backgroundColor = '';
            }, 200);
        });
    </script>
