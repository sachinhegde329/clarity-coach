<style>
        body {
            background-color: #fdf9f5; /* surface */
            background-image: radial-gradient(#dcc1b9 1px, transparent 1px); /* outline-variant */
            background-size: 20px 20px;
        }
        
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed #7c2d12;
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
        }

        .mic-active .pulse-ring {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        /* Card Layering Effect */

        .card-stack::before {

            position: absolute;
            top: 4px;
            left: 4px;
            right: -4px;
            bottom: -4px;
            background-color: #fdf9f5;
            border: 2px solid #7C2D12;

<script>
        // Simple JS for Mic Interaction
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('micButton');
            const statusText = document.getElementById('recordingStatus');
            let isRecording = false;

            micBtn.addEventListener('click', () => {
                isRecording = !isRecording;
                
                if (isRecording) {
                    micBtn.classList.add('mic-active');
                    micBtn.classList.remove('bg-primary');
                    micBtn.classList.add('bg-error-warning');
                    micBtn.classList.replace('border-primary', 'border-error-warning');
                    statusText.classList.remove('opacity-0');
                    statusText.classList.add('opacity-100');
                    statusText.textContent = 'Listening...';
                } else {
                    micBtn.classList.remove('mic-active');
                    micBtn.classList.remove('bg-error-warning');
                    micBtn.classList.add('bg-primary');
                    micBtn.classList.replace('border-error-warning', 'border-primary');
                    statusText.textContent = 'Saved.';
                    setTimeout(() => {
                        statusText.classList.remove('opacity-100');
                        statusText.classList.add('opacity-0');
                    }, 2000);
                }
            });
        });
    </script>
