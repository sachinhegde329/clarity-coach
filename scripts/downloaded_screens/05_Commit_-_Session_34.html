<script>
        // Simple 15s countdown script to match the timer ring
        document.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 15;
            const countdownEl = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft + 's';
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.textContent = 'DONE';
                    document.querySelector('.timer-ring').style.animationPlayState = 'paused';
                    document.querySelector('.mic-pulse').classList.remove('mic-pulse');
                }
            }, 1000);
        });
    </script>
