</svg>

<div class="absolute inset-0 rounded-full border-[1px] border-primary pulse-ring opacity-0 hidden" id="pulseEffect"></div>

</button>

</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('micBtn');
            const pulseEffect = document.getElementById('pulseEffect');
            const timeDisplay = document.getElementById('timeDisplay');
            const progressRing = document.getElementById('progressRing');
            
            let isRecording = false;
            let timeLeft = 15;
            let timerInterval;
            
            // Circle circumference for stroke-dashoffset (2 * pi * r) -> r=46 -> ~289
            const circumference = 289;

            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    // Start recording
                    isRecording = true;
                    pulseEffect.classList.remove('hidden');
                    pulseEffect.classList.add('block');
                    micBtn.classList.replace('bg-primary', 'bg-surface-tint');
                    
                    timeLeft = 15;
                    updateDisplay();
                    
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        updateDisplay();
                        
                        if (timeLeft <= 0) {
                            stopRecording();
                        }
                    }, 1000);
                } else {
                    stopRecording();
                }
            });

            function updateDisplay() {
                timeDisplay.textContent = timeLeft.toString().padStart(2, '0');
                const offset = circumference - (timeLeft / 15) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }

            function stopRecording() {
                isRecording = false;
                clearInterval(timerInterval);
                pulseEffect.classList.remove('block');
                pulseEffect.classList.add('hidden');
                micBtn.classList.replace('bg-surface-tint', 'bg-primary');
                // Optional: reset or transition to next state
                setTimeout(() => {
                    timeLeft = 15;
                    updateDisplay();
                }, 1000);
            }
        });
    </script>
