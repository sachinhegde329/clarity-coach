<style>
        body {
            background-color: #FDF9F5;
            color: #1c1c19;
            overflow-x: hidden;
        }

        .mic-btn-resting {
            background-color: #7C2D12;
            color: #FDF9F5;
            transition: all 0.3s ease;
        }

        .mic-btn-active {
            background-color: #7C2D12;
            color: #FDF9F5;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(124, 45, 18, 0.4);
            }
            70% {

            }
            100% {

            }
        }

        .timer-ring {
            stroke-dasharray: 188;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .card-brutalist {
            border: 2px solid #7C2D12;
            background-color: #FDF9F5;

<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor (Task-Focused, suppresses global shell) -->
<header class="w-full top-0 sticky bg-surface-parchment flex items-center justify-between px-margin-mobile md:px-margin-desktop py-unit border-b-border-width border-primary z-10">
<button class="text-primary hover:bg-primary-container/10 transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="font-metric-sm text-metric-sm text-primary tracking-widest flex items-center gap-2">
<span>SESSION 20</span>
<span class="text-outline">|</span>
<span class="font-bold">05 / 05</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-8 md:py-12 max-w-4xl mx-auto w-full relative z-0">
<div class="flex flex-col gap-gutter md:gap-8 mb-12">
<!-- Header Section -->
<div class="flex flex-col gap-unit">
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Commitment</h2>
<h1 class="font-display-lg text-display-lg text-primary max-w-2xl leading-tight">
                    What will you watch for tomorrow?
                </h1>
</div>
<!-- Suggestion Card (Bento/Card-on-Card Layering) -->
<div class="card-brutalist p-6 md:p-8 flex flex-col gap-6 relative overflow-hidden mt-4">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-container/20 rounded-bl-full -mr-10 -mt-10 pointer-events-none"></div>
<div class="flex items-start gap-4 z-10">
<div class="mt-1">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div class="flex flex-col gap-2">
<h3 class="font-headline-md text-headline-md text-primary">Suggested Opener</h3>
<p class="text-on-surface-variant font-body-lg text-body-lg">
                            Use this template to structure your commitment clearly.
                        </p>
</div>
</div>
<div class="inner-card-brutalist p-4 md:p-6 mt-2 relative z-10">
<p class="font-metric-sm text-metric-sm text-primary md:text-lg">
                        "Tomorrow I will mirror one phrase when..."
                    </p>
</div>
</div>
<!-- User Input Area (Visual representation before recording) -->
<div class="flex flex-col gap-2 mt-8">
<label class="font-label-caps text-label-caps text-primary uppercase">Your Commitment</label>
<div class="border-b-[0.5px] border-primary pb-2 min-h-[100px] flex items-end">
<p class="text-outline-variant font-body-lg text-body-lg italic">Tap the mic to state your commitment...</p>
</div>
</div>
</div>
<!-- Floating Mic Button Area -->
<div class="fixed bottom-8 left-0 w-full flex justify-center items-center z-20 pb-safe">
<div class="relative flex items-center justify-center">
<!-- SVG Timer Ring -->
<svg class="absolute w-[72px] h-[72px] -rotate-90 pointer-events-none" viewbox="0 0 64 64">
<circle cx="32" cy="32" fill="none" r="30" stroke="#e5e2de" stroke-width="2"></circle>
<circle class="timer-ring" cx="32" cy="32" fill="none" r="30" stroke="#7C2D12" stroke-width="2"></circle>
</svg>
<!-- Mic Button -->
<button class="mic-btn-resting w-[64px] h-[64px] rounded-full flex items-center justify-center border-border-width border-primary focus:outline-none z-10" id="recordBtn">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const recordBtn = document.getElementById('recordBtn');
            const timerRing = document.querySelector('.timer-ring');
            let isRecording = false;
            let timerInterval;
            const maxDuration = 10; // seconds

            recordBtn.addEventListener('click', () => {
                isRecording = !isRecording;
                
                if (isRecording) {
                    // Start Recording state
                    recordBtn.classList.remove('mic-btn-resting');
                    recordBtn.classList.add('mic-btn-active');
                    
                    // Animate timer ring
                    timerRing.style.transition = `stroke-dashoffset ${maxDuration}s linear`;
                    timerRing.style.strokeDashoffset = '188';

                    // Simulate end of recording
                    timerInterval = setTimeout(() => {
                        stopRecording();
                    }, maxDuration * 1000);

                } else {
                    // Stop Recording manually
                    stopRecording();
                }
            });

            function stopRecording() {
                isRecording = false;
                clearTimeout(timerInterval);
                
                // Reset states
                recordBtn.classList.remove('mic-btn-active');
                recordBtn.classList.add('mic-btn-resting');
                
                timerRing.style.transition = 'none';
                timerRing.style.strokeDashoffset = '0';
                
                // Force reflow to ensure transition is removed before re-adding
                void timerRing.offsetWidth; 
            }
        });
    </script>
