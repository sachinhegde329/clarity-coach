<body class="min-h-screen flex flex-col font-body-md text-on-surface">

<!-- Stats Grid -->

<div class="border-2 border-primary p-4 bg-surface">

<!-- Breathing Box -->

<!-- Grid Pattern -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#5e1700 1px, transparent 1px); background-size: 32px 32px;"></div>

</div>

</a>

<script>
        const startBtn = document.getElementById('start-btn');
        const circle = document.getElementById('circle-visual');
        const label = document.getElementById('breath-label');
        const timerText = document.getElementById('timer-text');

        let isRunning = false;
        let globalTimer;
        let seconds = 0;

        function updateTimer() {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerText.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function runBreathingCycle() {
            if (!isRunning) return;

            // Inhale phase (4 seconds)
            label.innerText = "Inhale";
            circle.classList.remove('exhale');
            circle.classList.add('inhale');

            setTimeout(() => {
                if (!isRunning) return;
                // Exhale phase (6 seconds)
                label.innerText = "Exhale";
                circle.classList.remove('inhale');
                circle.classList.add('exhale');
                
                setTimeout(() => {
                    if (isRunning) runBreathingCycle();
                }, 6000);
            }, 4000);
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                startBtn.innerText = "Pause Session";
                startBtn.classList.replace('bg-primary', 'bg-surface');
                startBtn.classList.replace('text-on-primary', 'text-primary');
                globalTimer = setInterval(updateTimer, 1000);
                runBreathingCycle();
            } else {
                isRunning = false;
                startBtn.innerText = "Resume Session";
                startBtn.classList.replace('bg-surface', 'bg-primary');
                startBtn.classList.replace('text-primary', 'text-on-primary');
                clearInterval(globalTimer);
                circle.classList.remove('inhale', 'exhale');
                label.innerText = "Ready";
            }
        });
    </script>
