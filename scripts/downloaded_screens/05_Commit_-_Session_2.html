<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#ede1d2",
                        "tertiary-fixed-dim": "#97ccf9",
                        "secondary-fixed": "#ede1d2",
                        "surface-variant": "#e5e2de",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#ebe7e4",
                        "surface-container-highest": "#e5e2de",
                        "surface-container-low": "#f7f3ef",
                        "surface": "#fdf9f5",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f4f0ec",
                        "secondary": "#655d52",
                        "primary-container": "#7c2d12",
                        "on-primary-container": "#ff9b7b",
                        "error": "#ba1a1a",
                        "primary": "#5e1700",
                        "on-secondary-fixed-variant": "#4d463b",
                        "outline": "#89726c",
                        "on-secondary-container": "#6b6357",
                        "outline-variant": "#dcc1b9",
                        "primary-fixed-dim": "#ffb59e",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#ffb59e",
                        "on-tertiary-container": "#85bbe6",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#ffdbd0",
                        "on-surface": "#1c1c19",
                        "surface-container": "#f1ede9",
                        "on-secondary-fixed": "#201b12",
                        "tertiary-container": "#004b71",
                        "secondary-fixed-dim": "#d0c5b7",
                        "inverse-surface": "#31302e",
                        "background": "#fdf9f5",
                        "surface-tint": "#9b4427",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#004b71",
                        "surface-dim": "#ddd9d6",
                        "on-primary-fixed-variant": "#7c2d12",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-background": "#1c1c19",
                        "surface-bright": "#fdf9f5",
                        "on-tertiary-fixed": "#001e30",
                        "on-primary-fixed": "#3a0b00",
                        "on-surface-variant": "#55423d",
                        "tertiary-fixed": "#cbe6ff",
                        "tertiary": "#00334f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "gutter": "24px",
                        "xs": "8px",
                        "xl": "80px",
                        "sm": "16px",
                        "lg": "48px",
                        "margin": "32px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Bricolage Grotesque"],
                        "display-lg": ["Bricolage Grotesque"],
                        "body-md": ["Space Grotesk"],
                        "body-lg": ["Space Grotesk"],
                        "label-md": ["Space Mono"],
                        "headline-lg-mobile": ["Bricolage Grotesque"],
                        "label-sm": ["Space Mono"],
                        "headline-lg": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "display-lg": ["72px", {"lineHeight": "1.0", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1.0", "fontWeight": "500"}],
                        "headline-lg-mobile": ["32px", {"lineHeight": "1.1", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "1.0", "fontWeight": "400"}],
                        "headline-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        .brutalist-shadow {
            box-shadow: 4px 4px 0px 0px #5e1700;
        }
        .active-recording {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #5e1700; transform: scale(1); }
            50% { border-color: #ba1a1a; transform: scale(1.02); }
            100% { border-color: #5e1700; transform: scale(1); }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Header -->
<header class="flex justify-between items-center px-6 py-6 w-full z-50 border-b-2 border-primary">
<div class="flex items-center gap-4">
<button class="hover:bg-secondary-container p-2 transition-colors border-2 border-transparent active:border-primary">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<span class="font-label-md text-label-md text-primary tracking-widest uppercase">Step 05/05</span>
</div>
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary uppercase">
        Clarity Coach
    </div>
</header>
<main class="flex-grow flex flex-col items-center px-6 pt-12 pb-32 max-w-4xl mx-auto w-full">
<!-- Progress Bar -->
<div class="w-full h-1 bg-secondary-container mb-12">
<div class="h-full bg-primary w-full transition-all duration-1000"></div>
</div>
<!-- Title Section -->
<section class="w-full text-left mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-4">
            05 Commit - Session 2
        </h1>
<div class="h-1 w-24 bg-primary"></div>
</section>
<!-- Prompt Card -->
<section class="w-full bg-surface border-2 border-primary p-8 brutalist-shadow mb-12">
<p class="font-label-sm text-label-sm text-secondary mb-2 uppercase tracking-widest">Intention</p>
<h2 class="font-headline-md text-headline-md text-on-surface mb-6 italic leading-snug">
            "Tomorrow I will notice my pace when..."
        </h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">
            Speak your commitment out loud. Let it land. Your voice carries the weight of your intention.
        </p>
</section>
<!-- Voice UI Section -->
<section class="w-full flex flex-col items-center justify-center">
<!-- Timer -->
<div class="font-label-md text-label-md text-primary mb-8 tracking-tighter tabular-nums" id="timer">
            00:00 / 00:15
        </div>
<!-- Waveform -->
<div class="flex items-end justify-center gap-1.5 h-20 mb-12 w-full max-w-xs" id="waveform">
<div class="w-2 h-4 bg-primary/20"></div>
<div class="w-2 h-8 bg-primary/30"></div>
<div class="w-2 h-14 bg-primary/40"></div>
<div class="w-2 h-20 bg-primary/60"></div>
<div class="w-2 h-16 bg-primary/40"></div>
<div class="w-2 h-10 bg-primary/30"></div>
<div class="w-2 h-6 bg-primary/20"></div>
</div>
<!-- Central Mic Button -->
<button class="group flex flex-col items-center justify-center w-36 h-36 bg-background border-2 border-primary transition-all duration-300 hover:-translate-y-1 hover:-translate-x-1 hover:shadow-[6px_6px_0px_0px_#5e1700] active:translate-y-0 active:translate-x-0 active:shadow-none" id="record-btn">
<span class="material-symbols-outlined text-primary text-5xl mb-2" data-icon="mic">mic</span>
<span class="font-label-sm text-label-sm text-primary font-bold tracking-widest uppercase">Tap to Record</span>
</button>
</section>
<!-- Encryption Disclaimer -->
<section class="mt-16 text-center">
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest opacity-60">
            Your recording is encrypted and private.
        </p>
</section>
</main>
<!-- Sticky Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t-2 border-primary p-6 flex justify-between items-center z-40">
<button class="font-label-md text-label-md text-secondary hover:text-primary transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined transition-transform group-hover:-translate-x-1" data-icon="arrow_back">arrow_back</span>
        BACK
    </button>
<div class="flex gap-4">
<button class="px-6 py-3 font-label-md text-label-md border-2 border-outline text-outline hover:bg-surface-variant transition-colors" id="skip-btn">
            SKIP STEP
        </button>
<button class="px-8 py-3 bg-primary text-on-primary font-label-md text-label-md brutalist-shadow opacity-50 cursor-not-allowed transition-all" id="finish-btn">
            FINISH SESSION
        </button>
</div>
</footer>
<script>
    const recordBtn = document.getElementById('record-btn');
    const timerText = document.getElementById('timer');
    const finishBtn = document.getElementById('finish-btn');
    const waveform = document.getElementById('waveform');
    let isRecording = false;
    let seconds = 0;
    let interval;

    recordBtn.addEventListener('click', () => {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    });

    function startRecording() {
        isRecording = true;
        recordBtn.classList.add('active-recording');
        recordBtn.querySelector('span:first-child').innerText = 'stop';
        recordBtn.querySelector('span:last-child').innerText = 'STOP';
        
        // Simple waveform animation toggle
        waveform.querySelectorAll('div').forEach((bar, i) => {
            bar.style.animation = `pulse 1s ease-in-out ${i * 0.1}s infinite`;
        });

        interval = setInterval(() => {
            seconds++;
            let displaySec = seconds < 10 ? '0' + seconds : seconds;
            timerText.innerText = `00:${displaySec} / 00:15`;
            
            if (seconds >= 15) {
                stopRecording();
            }
        }, 1000);
    }

    function stopRecording() {
        clearInterval(interval);
        isRecording = false;
        recordBtn.classList.remove('active-recording');
        recordBtn.querySelector('span:first-child').innerText = 'check_circle';
        recordBtn.querySelector('span:last-child').innerText = 'RECORDED';
        recordBtn.classList.add('bg-secondary-container');
        
        waveform.querySelectorAll('div').forEach(bar => {
            bar.style.animation = 'none';
        });
        
        finishBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        finishBtn.classList.add('hover:-translate-y-1', 'hover:-translate-x-1');
    }
</script>
<style>
    @keyframes pulse {
        0%, 100% { height: 20%; opacity: 0.2; }
        50% { height: 100%; opacity: 0.8; }
    }
</style>
</body></html>
