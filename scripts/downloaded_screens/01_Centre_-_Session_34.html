<!-- Script for potential micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Add subtle interaction to the breathing circle if hovered
            const breather = document.querySelector('.animate-breathe');
            if(breather) {
                breather.addEventListener('mouseenter', () => {
                    breather.style.animationPlayState = 'paused';
                    breather.style.transform = 'scale(1.05)';
                    breather.style.transition = 'transform 0.5s ease-out';
                });
                breather.addEventListener('mouseleave', () => {
                    breather.style.animationPlayState = 'running';
                    breather.style.transition = 'none'; // let animation take over
                });
            }
        });
    </script>
