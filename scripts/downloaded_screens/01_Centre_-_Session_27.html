<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;

            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .energy-segment-active {
            background-color: #7c2d12;
            transition: all 0.3s ease;
        }
        
        .energy-segment-inactive {
            background-color: transparent;
            border: 2px solid #7c2d12;

<body class="bg-surface-parchment text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface-parchment w-full top-0 sticky border-b-border-width border-primary flex items-center justify-between px-margin-mobile py-unit w-full z-10">
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-primary-container/10 transition-colors active:scale-95 transition-transform p-2 rounded flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tighter text-primary">CLARITY COACH</h1>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2 font-metric-sm text-metric-sm text-primary">
<span class="material-symbols-outlined text-sm">schedule</span>
<span>0:00</span>
</div>
<div class="flex items-center gap-2 font-metric-sm text-metric-sm text-primary border-l-border-width border-primary pl-6">
<span>01 / 05</span>
</div>
<div class="w-10 h-10 rounded-full border-border-width border-primary overflow-hidden ml-2 bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Session Context -->
<div class="absolute top-8 left-margin-mobile md:left-margin-desktop">
<h2 class="font-label-caps text-label-caps text-outline mb-1 uppercase tracking-widest">Session 27</h2>
<p class="font-headline-md text-headline-md text-primary">Centre</p>
</div>
<!-- Exercise Canvas -->
<div class="w-full max-w-2xl bg-surface border-border-width border-primary rounded p-8 md:p-12 relative shadow-[4px_4px_0px_0px_rgba(124,45,18,1)]">
<div class="text-center mb-12">
<h3 class="font-label-caps text-label-caps text-primary uppercase tracking-widest mb-4">vocal warm-up: energy range</h3>
<p class="font-display-lg text-display-lg text-on-surface max-w-lg mx-auto leading-tight">Say your name: quiet... normal... loud.</p>
</div>
<!-- Interactive Visualizer Area -->
<div class="flex flex-col md:flex-row items-center justify-center gap-12 my-16">
<!-- Mic Interaction -->
<div class="relative group cursor-pointer" id="mic-btn">
<div class="absolute inset-0 rounded-full border-border-width border-primary pulse-ring opacity-0" id="mic-pulse"></div>
<div class="w-24 h-24 rounded-full bg-primary border-border-width border-primary flex items-center justify-center relative z-10 hover:bg-surface-tint transition-colors">
<span class="material-symbols-outlined filled-icon text-on-primary text-4xl" data-icon="mic">mic</span>
</div>
</div>
<!-- Energy Bar Visualizer -->
<div class="flex flex-col gap-2 h-48 justify-end w-16">
<!-- High -->
<div class="h-1/3 w-full border-border-width border-primary bg-surface" id="seg-high"></div>
<!-- Mid -->
<div class="h-1/3 w-full border-border-width border-primary bg-surface" id="seg-mid"></div>
<!-- Low -->
<div class="h-1/3 w-full border-border-width border-primary bg-primary" id="seg-low"></div>
</div>
<div class="flex flex-col h-48 justify-between text-right py-4 font-metric-sm text-metric-sm text-outline">
<span>LOUD</span>
<span>NORMAL</span>
<span class="text-primary font-bold">QUIET</span>
</div>
</div>
<!-- Action Area -->
<div class="flex justify-center mt-12">
<button class="bg-surface border-border-width border-primary text-primary font-headline-md text-headline-md px-8 py-3 rounded hover:bg-primary hover:text-on-primary transition-colors flex items-center gap-2">
                    Begin Recording
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Global Progress Bar -->
<footer class="w-full bg-surface-parchment border-t-border-width border-primary flex flex-col">
<!-- Progress Strip -->
<div class="w-full h-2 bg-surface-variant flex">
<div class="h-full bg-primary w-1/5 relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-surface-parchment border-border-width border-primary rounded-full"></div>
</div>
<div class="h-full bg-transparent w-1/5 border-r-hairline border-outline-variant"></div>
<div class="h-full bg-transparent w-1/5 border-r-hairline border-outline-variant"></div>
<div class="h-full bg-transparent w-1/5 border-r-hairline border-outline-variant"></div>
<div class="h-full bg-transparent w-1/5"></div>
</div>
<!-- Steps Text (Desktop) -->
<div class="hidden md:flex w-full justify-between px-margin-desktop py-4 font-label-caps text-label-caps text-outline uppercase">
<span class="text-primary font-bold">1. Centre</span>
<span>2. Listen</span>
<span>3. Do</span>
<span>4. See</span>
<span>5. Commit</span>
</div>
</footer>
<script>
        // Simple interaction simulation
        const micBtn = document.getElementById('mic-btn');
        const pulse = document.getElementById('mic-pulse');
        const segLow = document.getElementById('seg-low');
        const segMid = document.getElementById('seg-mid');
        const segHigh = document.getElementById('seg-high');
        
        let isRecording = false;
        let interval;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            
            if (isRecording) {
                pulse.classList.remove('opacity-0');
                // Simulate energy levels
                interval = setInterval(() => {
                    const level = Math.floor(Math.random() * 3);
                    
                    segLow.className = 'h-1/3 w-full border-border-width border-primary transition-colors duration-200 ' + (level >= 0 ? 'bg-primary' : 'bg-surface');
                    segMid.className = 'h-1/3 w-full border-border-width border-primary transition-colors duration-200 ' + (level >= 1 ? 'bg-primary' : 'bg-surface');
                    segHigh.className = 'h-1/3 w-full border-border-width border-primary transition-colors duration-200 ' + (level >= 2 ? 'bg-primary' : 'bg-surface');
                    
                }, 400);
            } else {
                pulse.classList.add('opacity-0');
                clearInterval(interval);
                segLow.className = 'h-1/3 w-full border-border-width border-primary bg-primary transition-colors duration-200';
                segMid.className = 'h-1/3 w-full border-border-width border-primary bg-surface transition-colors duration-200';
                segHigh.className = 'h-1/3 w-full border-border-width border-primary bg-surface transition-colors duration-200';
            }
        });
    </script>
