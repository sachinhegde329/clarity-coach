</div>

<div class="w-full bg-surface-bright border-border-width border-primary rounded-lg p-6 md:p-12 flex flex-col items-center justify-center relative overflow-hidden">

<div class="absolute inset-0 pointer-events-none opacity-[0.03] bg-[linear-gradient(to_right,#7C2D12_1px,transparent_1px),linear-gradient(to_bottom,#7C2D12_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

            </p>

<div class="relative flex items-center justify-center mb-16">

<div class="w-64 h-64 md:w-80 md:h-80 rounded-full border-[0.5px] border-outline absolute"></div>
