<div class="relative flex items-center justify-center w-full aspect-square max-w-[280px]">
<!-- Outer Frame -->
<div class="absolute inset-0 border-2 border-outline-variant opacity-20"></div>
<!-- Interaction Box: standardized 2px borders -->

<span class="font-label-md text-headline-md text-primary font-bold" id="timer-digit">4</span>
</div>
<!-- Ritual Feedback -->

<p class="font-label-md text-label-md text-primary uppercase font-bold tracking-widest" id="ritual-status">Ready to Start</p>
</div>
</div>
</div>
<!-- Context Card -->
<div class="bg-surface-container border-2 border-primary p-md hard-shadow">
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                Build comfort with intentional silence. <span class="font-bold text-primary italic">Inhale (4s), Hold (4s), Exhale (4s).</span> Rhythmic focus creates instant neurological stillness.
            </p>
</div>
</main>
<!-- Controls Footer -->
<footer class="sticky bottom-0 bg-surface border-t-2 border-primary p-margin flex flex-col gap-md z-40">
<div class="flex gap-md">
<button class="flex-1 py-4 border-2 border-primary font-label-md text-label-md text-primary uppercase font-bold hover:bg-secondary-fixed transition-colors active-press">

<button class="flex-[2] py-4 border-2 border-primary bg-primary text-surface font-label-md text-label-md uppercase font-bold hard-shadow hover:-translate-y-1 hover:-translate-x-1 transition-all active:translate-x-0 active:translate-y-0 active:shadow-none" id="start-btn">
                Start Session
            </button>
</div>
</footer>
<script>
        const ritualBox = document.getElementById('ritual-box');
        const ritualStatus = document.getElementById('ritual-status');
        const timerDigit = document.getElementById('timer-digit');
        const startBtn = document.getElementById('start-btn');
        
        let active = false;
        let step = 0; // 0: Inhale, 1: Hold, 2: Exhale
        let timer = 4;
        let ticker;

        function runRitual() {
            if (timer > 1) {
                timer--;
                timerDigit.innerText = timer;
            } else {
                timer = 4;
                step = (step + 1) % 3;
                timerDigit.innerText = timer;
                
                if (step === 0) {
                    ritualStatus.innerText = "Inhale";
                    ritualBox.style.transform = "scale(1.8)";
                    ritualBox.style.backgroundColor = "var(--secondary-container)";
                } else if (step === 1) {
                    ritualStatus.innerText = "Hold";
                    ritualBox.style.backgroundColor = "#ffdbd0";
                } else {
                    ritualStatus.innerText = "Exhale";
                    ritualBox.style.transform = "scale(1)";
                    ritualBox.style.backgroundColor = "var(--surface-container)";
                }
            }
        }

        startBtn.addEventListener('click', () => {
            if (!active) {
                active = true;
                startBtn.innerText = "Pause Session";
                ritualStatus.innerText = "Inhale";
                ritualBox.style.transform = "scale(1.8)";
                ticker = setInterval(runRitual, 1000);
            } else {
                active = false;
                startBtn.innerText = "Start Session";
                ritualStatus.innerText = "Paused";
                clearInterval(ticker);
            }
        });

        // Init
        ritualBox.style.transform = "scale(1)";
    </script>
