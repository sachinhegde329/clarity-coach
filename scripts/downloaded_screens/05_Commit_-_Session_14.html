<script>
        const micBtn = document.getElementById('mic-btn');
        const pulseContainer = document.getElementById('pulse-container');
        const timerText = document.getElementById('timer-text');
        const timerRing = document.getElementById('timer-ring');
        
        let isRecording = false;
        let timeLeft = 15;
        let timerInterval;
        const totalLength = 238.76; // Circumference for r=38

        micBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        function startRecording() {
            isRecording = true;
            pulseContainer.classList.remove('hidden');
            micBtn.classList.add('bg-error-warning');
            micBtn.innerHTML = '<span class="material-symbols-outlined text-3xl">stop</span>';
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) stopRecording();
            }, 1000);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);
            pulseContainer.classList.add('hidden');
            micBtn.classList.remove('bg-error-warning');
            micBtn.innerHTML = '<span class="material-symbols-outlined text-3xl" style="font-variation-settings: \'FILL\' 1;">mic</span>';
            timeLeft = 15;
            updateDisplay();
        }

        function updateDisplay() {
            const seconds = timeLeft.toString().padStart(2, '0');
            timerText.innerText = `00:${seconds}`;
            
            const offset = totalLength - (timeLeft / 15) * totalLength;
            timerRing.style.strokeDashoffset = offset;
        }
    </script>
