<style>
        body {
            background-color: theme('colors.surface-parchment');
            color: theme('colors.on-surface');
            font-family: 'Bricolage Grotesque', sans-serif;
            /* Architectural grid background */
            background-image: 
                linear-gradient(theme('colors.surface-variant') 1px, transparent 1px),
                linear-gradient(90deg, theme('colors.surface-variant') 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
            margin-bottom: 80px; /* Safe area for bottom nav */
            margin-top: 64px; /* Safe area for top app bar */
        }
        
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        
        .icon-fill {
           font-variation-settings: 'FILL' 1;
        }

        /* Brutalist Card Style */
        .brutalist-card {
            background-color: theme('colors.surface-parchment');
            border: theme('spacing.border-width') solid theme('colors.primary');
            border-radius: theme('borderRadius.DEFAULT');
        }

        /* Mic Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .pulse-active::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 2px dashed theme('colors.primary');
            border-radius: 50%;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        /* Progress Timer Animation */
        .timer-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>

<circle class="text-primary stroke-current timer-ring" cx="50" cy="50" fill="transparent" r="46" stroke-dasharray="289" stroke-dashoffset="100" stroke-linecap="square" stroke-width="4"></circle>
</svg>
