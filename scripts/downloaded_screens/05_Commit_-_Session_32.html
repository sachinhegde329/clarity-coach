<!-- Lightweight JS for Mic Interaction Demo -->
<script>
        const recordBtn = document.getElementById('recordButton');
        const pulse1 = document.getElementById('pulse1');
        const pulse2 = document.getElementById('pulse2');
        const progressRing = document.getElementById('progressRing');
        const timerDisplay = document.getElementById('timerDisplay');
        const micIcon = document.getElementById('micIcon');
        
        let isRecording = false;
        let timerInterval;
        let timeLeft = 15;
        const totalDash = 490; // Approx circumference of r=78 circle

        function startRecording() {
            if(isRecording) return;
            isRecording = true;
            
            // Visual feedback
            recordBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
            recordBtn.classList.replace('border-primary', 'border-tertiary');
            micIcon.innerText = 'graphic_eq';
            pulse1.classList.remove('hidden');
            pulse2.classList.remove('hidden');
            
            // Timer logic
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                
                // Update text
                const seconds = Math.ceil(timeLeft);
                timerDisplay.innerText = `00:${seconds < 10 ? '0'+seconds : seconds}`;
                
                // Update ring (depletes clockwise)
                const offset = totalDash - (timeLeft / 15) * totalDash;
                progressRing.style.strokeDashoffset = offset;

                if(timeLeft <= 0) {
                    stopRecording();
                    timerDisplay.innerText = "DONE";
                }
            }, 100);
        }

        function stopRecording() {
            if(!isRecording) return;
            isRecording = false;
            clearInterval(timerInterval);
            
            // Reset visuals
            recordBtn.classList.replace('bg-tertiary-container', 'bg-primary-container');
            recordBtn.classList.replace('border-tertiary', 'border-primary');
            micIcon.innerText = 'mic';
            pulse1.classList.add('hidden');
            pulse2.classList.add('hidden');
            
            // Reset state (for demo purposes)
            setTimeout(() => {
                timeLeft = 15;
                timerDisplay.innerText = "00:15";
                progressRing.style.strokeDashoffset = 0;
            }, 2000);
        }

        // Desktop interactions
        recordBtn.addEventListener('mousedown', startRecording);
        recordBtn.addEventListener('mouseup', stopRecording);
        recordBtn.addEventListener('mouseleave', stopRecording);

        // Mobile interactions
        recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, {passive: false});
        recordBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); }, {passive: false});
    </script>
