<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<title>Clarity Coach - Centre</title>

                        "surface-bright": "#fdf9f5",

                        "surface-container": "#f1ede9",

                        "secondary": "#57624f",

                        "success-sage": "#818C78",
                        "on-primary-fixed-variant": "#7c2d12",

                        "on-error-container": "#93000a",
                        "surface-container-high": "#ebe7e4",

                        "primary-fixed-dim": "#ffb59e",

                    },
                    borderRadius: {

                    },
                    spacing: {
                        "hairline": "0.5px",
                        "border-width": "2px",

                        "margin-desktop": "40px"
                    },
                    fontFamily: {

<style>
        .pulse-animation {
            animation: pulse-ring 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-parchment text-on-surface h-screen flex flex-col overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor -->
<header class="w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop py-gutter border-b-border-width border-border-primary sticky top-0 bg-surface-parchment z-50">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-primary-container/10 p-2 rounded-full transition-colors active:scale-95" data-icon="close">close</span>
</div>
<div class="flex items-center gap-gutter">
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">Tactical Empathy</span>
<span class="font-metric-sm text-metric-sm bg-primary text-on-primary px-3 py-1 rounded-full border-border-width border-primary">01 / 05</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative p-margin-mobile md:p-margin-desktop">
<!-- The Active Session Framework (Centre) -->
<div class="flex flex-col items-center justify-center space-y-12 max-w-2xl text-center w-full relative z-10">
<!-- Session Context -->
<div class="space-y-unit">
<p class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Session 20</p>
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter">Centre</h1>
</div>
<!-- The Ink Pulse Central Element -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center cursor-pointer group" onclick="document.getElementById('proceed-btn').classList.remove('opacity-0', 'pointer-events-none'); this.classList.add('scale-95'); setTimeout(() =&gt; this.classList.remove('scale-95'), 200);">
<!-- Outer Pulse Rings -->
<div class="absolute inset-0 bg-primary/10 rounded-full pulse-animation" style="animation-delay: 0s;"></div>
<div class="absolute inset-4 bg-primary/20 rounded-full pulse-animation" style="animation-delay: -1s;"></div>
<div class="absolute inset-8 bg-primary/30 rounded-full pulse-animation" style="animation-delay: -2s;"></div>
<!-- Core Solid Anchor -->
<div class="relative w-32 h-32 md:w-40 md:h-40 bg-primary rounded-full border-border-width border-border-primary shadow-sm flex items-center justify-center transition-transform duration-300 group-hover:scale-105">
<span class="material-symbols-outlined text-surface-parchment text-5xl" style="font-variation-settings: 'FILL' 1;">self_improvement</span>
</div>
</div>
<!-- Direct Instruction -->
<div class="max-w-md mx-auto space-y-unit">
<p class="font-body-lg text-body-lg text-primary leading-relaxed">
                    You are about to hear someone. <br/> <strong class="font-bold">Hear them.</strong>
</p>
</div>
<!-- Proceed Action (Hidden initially, revealed via JS on interaction) -->
<button class="opacity-0 pointer-events-none transition-opacity duration-500 mt-gutter bg-primary text-on-primary border-border-width border-border-primary px-8 py-3 rounded-DEFAULT font-headline-md text-body-lg hover:bg-primary-container hover:text-on-primary-container active:scale-95 flex items-center gap-2" id="proceed-btn">
                Continue to Listen
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<!-- Structural Grid Background (Warm Brutalist architectural feel) -->
<div class="absolute inset-0 pointer-events-none opacity-20 z-0 flex flex-col">
<!-- Vertical Grid Lines -->
<div class="flex-grow flex justify-between px-margin-mobile md:px-margin-desktop w-full h-full">
<div class="w-px h-full bg-border-primary"></div>
<div class="w-px h-full bg-border-primary hidden md:block"></div>
<div class="w-px h-full bg-border-primary hidden lg:block"></div>
<div class="w-px h-full bg-border-primary hidden lg:block"></div>
<div class="w-px h-full bg-border-primary hidden md:block"></div>
<div class="w-px h-full bg-border-primary"></div>
</div>
</div>
</main>
<!-- Bottom Progress/Nav Framework (Suppressed per instructions for focused session screens, but minimal indicator included) -->
<footer class="w-full h-16 border-t-border-width border-border-primary bg-surface-parchment flex justify-center items-center px-margin-mobile z-50">
<div class="flex items-center gap-4">
<div class="h-2 w-12 bg-primary rounded-full border-hairline border-border-primary"></div>
<div class="h-2 w-4 bg-outline-variant rounded-full border-hairline border-outline-variant"></div>
<div class="h-2 w-4 bg-outline-variant rounded-full border-hairline border-outline-variant"></div>
<div class="h-2 w-4 bg-outline-variant rounded-full border-hairline border-outline-variant"></div>
<div class="h-2 w-4 bg-outline-variant rounded-full border-hairline border-outline-variant"></div>
</div>
</footer>
</body></html>
