<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Grid background pattern for architectural feel */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(124, 45, 18, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(124, 45, 18, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Pulse animation for active mic */
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; border-width: 2px; }
            100% { transform: scale(1.5); opacity: 0; border-width: 0px; }
        }
        .mic-pulse::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: solid #7C2D12;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col bg-grid-pattern overflow-x-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky z-40 border-b-2 border-primary dark:border-primary-container flat no shadows flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4">
<button class="text-on-surface-variant hover:bg-surface-container active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim text-center uppercase tracking-tight">

<button class="text-on-surface-variant hover:bg-surface-container active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[24px]">account_circle</span>
</button>

<!-- Session Progress (5 Steps) -->
<div class="w-full max-w-sm flex gap-2 mb-16 px-4">
<div class="h-2 flex-1 bg-primary/20 border-border-width border-primary/30 rounded-full"></div>
<div class="h-2 flex-1 bg-primary/20 border-border-width border-primary/30 rounded-full"></div>
<div class="h-2 flex-1 bg-primary/20 border-border-width border-primary/30 rounded-full"></div>
<div class="h-2 flex-1 bg-primary/20 border-border-width border-primary/30 rounded-full"></div>
<!-- Active Step 5 -->
<div class="h-2 flex-1 bg-primary border-border-width border-primary rounded-full relative">
<div class="absolute -top-6 left-1/2 -translate-x-1/2 font-label-caps text-label-caps text-primary whitespace-nowrap">COMMIT</div>
</div>
</div>
<!-- Capstone Prompt -->
<div class="text-center mb-16 flex flex-col items-center space-y-6">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase border border-outline px-3 py-1 rounded-sm bg-surface-container-low">The Final Artifact</span>
<h1 class="font-display-lg text-display-lg text-primary max-w-2xl leading-tight">
                What did you become?
            </h1>
<p class="font-metric-sm text-metric-sm text-on-surface-variant opacity-80 uppercase tracking-widest mt-4">
                30 SECONDS • UNEDITED
            </p>
</div>
<!-- Mic Button Area -->
<div class="relative flex flex-col items-center justify-center mb-16">
<button class="w-[80px] h-[80px] rounded-full bg-primary text-on-primary border-border-width border-primary flex items-center justify-center relative shadow-none hover:bg-primary-container transition-colors duration-200 focus:outline-none mic-pulse">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">mic</span>
<!-- Timer Ring overlay (depleting concept) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="rgba(253, 249, 245, 0.2)" stroke-width="4"></circle>
<circle class="transition-all duration-1000" cx="50" cy="50" fill="none" r="48" stroke="#FDF9F5" stroke-dasharray="301" stroke-dashoffset="0" stroke-width="4"></circle>
</svg>
</button>
<div class="mt-6 font-metric-sm text-metric-sm text-primary tabular-nums">00:30</div>
</div>
<!-- The 36 Commits Timeline Grid -->
<div class="w-full max-w-sm mb-16">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-4 text-center border-b border-outline pb-2">THE ARCHIVE</div>
<div class="grid grid-cols-6 gap-3 justify-items-center bg-surface-bright border-border-width border-primary p-6 rounded-lg relative overflow-hidden">
<!-- 35 Previous dots -->
<script>
                    for(let i=1; i<=35; i++) {
                        document.write(`<div class="w-3 h-3 rounded-full bg-primary/20 border border-primary/30" title="Session ${i}"></div>`);

<div class="w-3 h-3 rounded-full bg-primary border border-primary shadow-[0_0_8px_rgba(94,23,0,0.5)] ring-2 ring-primary/30 relative" title="Session 36">

</div>
