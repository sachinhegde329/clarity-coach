<style>
        /* Custom Animations for the Breathing Exercise */
        @keyframes breathe {
            0% { transform: scale(0.6); opacity: 0.5; border-width: 2px; }
            50% { transform: scale(1.2); opacity: 1; border-width: 4px; }
            100% { transform: scale(0.6); opacity: 0.5; border-width: 2px; }
        }
        .animate-breathe {
            animation: breathe 8s infinite ease-in-out;
        }
        
        /* Ensure no shadows globally as per style guide */
        * { box-shadow: none !important; }
