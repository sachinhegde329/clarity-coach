<script>
    // Micro-interaction for the breathing circle
    const button = document.querySelector('button');
    const timerText = document.querySelector('.font-metric-hero');
    let timeLeft = 30;
    let isActive = false;

    button.addEventListener('click', () => {
      if(isActive) return;
      isActive = true;
      button.innerText = "Focusing...";
      
      const interval = setInterval(() => {
        timeLeft--;
        const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
        timerText.innerText = `00:${seconds}`;
        
        if(timeLeft <= 0) {
          clearInterval(interval);
          button.innerText = "Proceed to Listen";
          isActive = false;
        }
      }, 1000);
    });
  </script>
