<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .pulse-circle {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
                border-width: theme('spacing.border-width');
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
                border-width: theme('spacing.hairline');
            }
        }

            transition: width 0.3s ease;

<body class="min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface-parchment dark:bg-surface-dim border-b-2 border-border-primary dark:border-outline-variant transition-colors">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full h-16">
<button aria-label="Menu" class="flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-primary-fixed-dim/10 transition-colors active:scale-95 duration-150 p-2 rounded-DEFAULT">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">grid_view</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-on-surface tracking-tight truncate px-4 text-center">Clarity Coach</h1>
<div class="font-metric-sm text-metric-sm text-primary dark:text-primary-fixed flex items-center shrink-0">
<span>01 / 05</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter py-8 relative w-full max-w-4xl mx-auto">
<!-- Session Context Header -->
<div class="w-full mb-12 text-center flex flex-col items-center">
<span class="font-label-caps text-label-caps text-primary-container uppercase tracking-widest mb-2 block">Session 22</span>
<h2 class="font-display-lg text-display-lg text-on-surface font-extrabold tracking-tight mb-4 max-w-2xl">The Aikido Pivot</h2>
<div class="inline-flex items-center border-2 border-border-primary bg-surface rounded-DEFAULT px-4 py-1.5 shadow-sm">
<span class="material-symbols-outlined text-primary-container mr-2 text-sm" style="font-variation-settings: 'FILL' 1;">self_improvement</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant font-bold uppercase tracking-wider">Step 1: Centre</span>
</div>
</div>
<!-- Breathing Interaction Canvas (Glassmorphism/Bento hybrid approach in structural style) -->
<div class="relative w-full max-w-md aspect-square flex items-center justify-center mb-16">
<!-- Structural Grid Overlay (Decorative Brutalist Element) -->
<div class="absolute inset-0 border-2 border-border-primary/20 rounded-lg pointer-events-none grid grid-cols-2 grid-rows-2">
<div class="border-r-2 border-b-2 border-border-primary/20"></div>
<div class="border-b-2 border-border-primary/20"></div>
<div class="border-r-2 border-border-primary/20"></div>
<div></div>
</div>
<!-- Central Interactive Zone -->
<div class="relative z-10 flex flex-col items-center justify-center">
<!-- The Breathing Circle -->
<div class="w-64 h-64 rounded-full border-2 border-border-primary bg-surface-container-high/50 flex items-center justify-center pulse-circle shadow-sm backdrop-blur-sm relative">
<!-- Inner Core -->
<div class="w-48 h-48 rounded-full border border-border-primary/40 flex items-center justify-center relative">
<span class="material-symbols-outlined text-primary-container opacity-50" style="font-size: 48px; font-variation-settings: 'FILL' 0;">air</span>
</div>
</div>
<!-- Grounding Text (Absolute positioned within central zone for overlap) -->
<div class="absolute -bottom-8 bg-surface border-2 border-border-primary px-6 py-3 rounded-lg shadow-md whitespace-nowrap z-20">
<p class="font-headline-md text-headline-md text-on-surface font-bold">Stay centered.</p>
</div>
</div>
<!-- Ambient Data Points (Brutalist corner details) -->
<div class="absolute top-4 left-4 font-metric-sm text-metric-sm text-on-surface-variant/60 tracking-wider">INT: EXPECTED</div>
<div class="absolute bottom-4 right-4 font-metric-sm text-metric-sm text-on-surface-variant/60 tracking-wider">RHYTHM: 4.4</div>
</div>
<!-- Instructional Subtext Card -->
<div class="w-full max-w-2xl bg-surface border-2 border-border-primary p-6 rounded-DEFAULT text-center relative overflow-hidden">

<div class="absolute inset-1 border-[0.5px] border-border-primary/30 pointer-events-none"></div>
<p class="font-body-lg text-body-lg text-on-surface-variant relative z-10">
<span class="font-bold text-primary block mb-2">Grounding Exercise</span>

            </p>
</div>

</div>

</div>

</div>

</div>
