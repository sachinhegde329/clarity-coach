<style>
        /* Warm Brutalist Precision - Custom Animations & Overrides */
        body {
            background-color: theme('colors.surface-parchment');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Architectural Containment Helpers */
        .brutalist-border {
            border: 2px solid theme('colors.border-primary');
        }
        
        .brutalist-border-thin {
            border: 0.5px solid theme('colors.outline');
        }

        /* Slow Breathing Circle Animation */
        @keyframes breath {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.6; }
        }
        
        .breathe-circle-1 {
            animation: breath 8s infinite ease-in-out;
        }
        .breathe-circle-2 {
            animation: breath 8s infinite ease-in-out;
            animation-delay: -2.6s;
        }
        .breathe-circle-3 {
            animation: breath 8s infinite ease-in-out;
            animation-delay: -5.2s;
        }

        /* Sequence Text Fade */
        @keyframes text-cycle {
            0%, 20% { opacity: 1; transform: translateY(0); }
            30%, 100% { opacity: 0; transform: translateY(-10px); }
        }
        .cycle-text-1 { animation: text-cycle 12s infinite; }
        .cycle-text-2 { animation: text-cycle 12s infinite; animation-delay: 4s; opacity: 0; }
        .cycle-text-3 { animation: text-cycle 12s infinite; animation-delay: 8s; opacity: 0; }

        /* Typography overrides to ensure font loading */
        .font-display-lg { font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; line-height: 56px; letter-spacing: -0.02em; font-weight: 800; }
        .font-headline-lg { font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; line-height: 40px; font-weight: 700; }
        .font-headline-md { font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; line-height: 32px; font-weight: 600; }
        .font-body-lg { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; line-height: 28px; font-weight: 400; }
        .font-body-md { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; }
        .font-metric-hero { font-family: 'JetBrains Mono', monospace; font-size: 40px; line-height: 40px; letter-spacing: -0.04em; font-weight: 700; }
        .font-metric-sm { font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 16px; font-weight: 500; }
        .font-label-caps { font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 16px; letter-spacing: 0.05em; font-weight: 700; }
    </style>
