<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 border-b-2 border-primary-container bg-surface">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-variant transition-colors p-2 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<span class="font-headline-md text-headline-md text-primary font-bold">01/05</span>
</div>
<div class="font-label-caps text-label-caps text-on-surface-variant bg-surface-variant px-3 py-1 rounded-sm border-hairline border-outline">
            0:00
        </div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop relative">
<!-- Headers -->
<div class="text-center mb-12 flex flex-col items-center gap-4 z-10">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight uppercase">Centre</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">
                You are about to feel what is on the other side of free.
            </p>
</div>
<!-- Breathing Circle (Architectural) -->
<div class="relative w-64 h-64 flex items-center justify-center my-8 z-10">
<!-- Outer containment ring -->
<div class="absolute inset-0 border-2 border-primary-container rounded-full opacity-20"></div>
<!-- Inner breathing element -->
<div class="w-48 h-48 border-2 border-primary bg-surface-container rounded-full animate-pulse-breathe flex items-center justify-center relative overflow-hidden shadow-[inset_0_0_0_2px_#7c2d12]">
<!-- Structural grid lines inside circle for brutalist feel -->
<div class="absolute inset-0 flex justify-center items-center opacity-10">
<div class="w-full h-hairline bg-primary"></div>
<div class="h-full w-hairline bg-primary absolute"></div>
</div>
</div>
</div>
<!-- Instruction Text -->
<div class="mt-8 z-10">
<p class="font-label-caps text-label-caps text-primary tracking-widest uppercase" id="breathe-text">Breathe in...</p>
</div>
</main>
<!-- Progress Bar Bottom -->
<div class="w-full bg-surface-container h-2 border-t-2 border-primary-container flex">
<div class="h-full bg-primary w-1/5 transition-all duration-1000 ease-linear"></div>
</div>
<script>
        // Simple script to toggle breathing text to match standard breathing exercises
        const breatheText = document.getElementById('breathe-text');
        let isIn = true;
        
        setInterval(() => {
            isIn = !isIn;
            breatheText.textContent = isIn ? "Breathe in..." : "Breathe out...";
        }, 4000); // 4 seconds in, 4 seconds out
    </script>
</body></html>
